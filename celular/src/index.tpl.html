<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conestoga connection</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=UnifrakturMaguntia&display=swap">
</head>
<body>
<header class="topo">
  <span class="rosa-topo" id="t-rosa" aria-hidden="true"></span>
  <img id="t-foto" class="avatar" alt="" hidden>
  <div class="nome"><b id="t-nome">Conestoga connection</b><small id="t-sub"></small></div>
  <div class="nivel" id="nivel"><button class="so-ed" data-a="nivel" data-d="-1" aria-label="Diminuir nível">−</button><span id="nv">Nv 1</span><button class="so-ed" data-a="nivel" data-d="1" aria-label="Subir nível">+</button></div>
  <button class="icone" data-a="dados" aria-label="Rolar dados">🎲</button>
  <button class="icone" data-a="menu" aria-label="Menu">☰</button>
  <div id="faixa-vitais" hidden></div>
</header>
<main class="pagina" id="pagina"></main>
<div class="mesa oculto" id="mesa"></div>
<button class="dado-flutuante" id="dado-flutuante" data-a="leque" aria-label="Rolar: iniciativa, perícias e dado livre (segure para o diário)" hidden>🎲</button>
<nav class="nav" id="nav"></nav>
<div class="veu" id="veu"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true">
  <div class="alca"></div>
  <header><h3 id="folha-tit"></h3><button class="icone" style="background:var(--campo);color:var(--tinta);border-color:var(--linha)" data-a="fechar" aria-label="Fechar">✕</button></header>
  <div class="corpo" id="folha-corpo"></div>
  <div class="rodape" id="folha-rod"></div>
</section>
<div class="toast" id="toast"></div>
<input type="file" id="arquivo" accept=".json,application/json" hidden>
<script>window.DADOS=/*DADOS*/;</script>
<script>/*REGRAS*/</script>
<script>/*APP*/</script>
</body>
</html>
