name: Testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt
      - name: Testes de mesa, grupo e conexão
        run: for t in testes/test_*.py; do echo "== $t"; xvfb-run -a python "$t" || exit 1; done
      - name: PC e celular dão os mesmos resultados
        run: sh celular/testes/rodar.sh
      - name: App do celular está atualizado (docs/ e pagina_celular.py)
        run: |
          cp pagina_celular.py /tmp/pagina_antes.py
          python celular/build.py
          git diff --exit-code -- docs || { echo "Rode py celular/build.py e faça commit do resultado."; exit 1; }
          # o HTML vem compactado com zlib, cujos bytes variam entre versões: compara o conteúdo descompactado
          python - <<'PY'
          import importlib.util as u
          def html(c):
              m = u.spec_from_file_location("p", c); x = u.module_from_spec(m); m.loader.exec_module(x); return x.HTML
          assert html("/tmp/pagina_antes.py") == html("pagina_celular.py"), "pagina_celular.py desatualizado: rode py celular/build.py"
          PY
