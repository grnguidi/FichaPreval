<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prevalecentes — Ficha de Mesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{
  --fundo:#1b2520; --fundo2:#26342c; --perg:#f2e9d3; --perg2:#e6d7b4; --campo:#fbf7ea; --tinta:#2d2015; --tinta2:#7d6a54;
  --ouro:#b39552; --ouro2:#dcc387; --vinho:#7c2626; --verde:#4a6d33; --faixa:#f6efdc; --linha:#ddcda6;
  --c-vida:#9a3d33; --c-mana:#3f6283; --c-vigor:#567a3b; --c-mov:#3d7471; --c-ca:#6f675a; --c-atk:#a2463e; --c-def:#4a6893;
  --c-per:#b07a3c; --c-tal:#3d7471; --c-atr:#3b4a3f; --rosa:#f1dcd6; --agua:#d7e7e3;
  --serif:"EB Garamond","Palatino Linotype","Book Antiqua",Georgia,serif; --tit:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --sombra:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(40,25,10,.35);
}
html.noite{
  --fundo:#0d120f; --fundo2:#18211b; --perg:#1b231e; --perg2:#2a342d; --campo:#232c26; --tinta:#e8dec5; --tinta2:#a3977f;
  --ouro:#8f7542; --ouro2:#d6bd82; --vinho:#d27467; --verde:#8dbb68; --faixa:#f3ead4; --linha:#36423a;
  --c-vida:#80352d; --c-mana:#34516e; --c-vigor:#476532; --c-mov:#33605e; --c-ca:#5b554a; --c-atk:#86403a; --c-def:#3d5679;
  --c-per:#8c6232; --c-tal:#33605e; --c-atr:#2f3d33; --rosa:#33262a; --agua:#1f302c; --sombra:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--serif);font-size:16px}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topo{position:sticky;top:0;z-index:20;background:var(--fundo);color:var(--ouro2);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ouro)}
.topo .nome{flex:1;min-width:0}
.topo .nome b{display:block;font-family:var(--tit);font-size:17px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .nome small{color:#9fae9f;font-style:italic;font-size:12.5px}
.nivel{display:flex;align-items:center;gap:2px;background:var(--fundo2);border:1px solid #3d4d42;border-radius:22px;padding:2px}
.nivel button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--ouro2);font-size:20px;line-height:1}
.nivel span{min-width:44px;text-align:center;font-family:var(--tit);font-size:13px}
.icone{width:38px;height:38px;border-radius:10px;border:1px solid #3d4d42;background:var(--fundo2);color:var(--ouro2);font-size:19px}
.pagina{background:var(--perg);min-height:calc(100vh - 120px);padding:14px 14px 28px;border-top-left-radius:14px;border-top-right-radius:14px;margin-top:8px}
.oculto{display:none!important}
.secao{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;color:var(--vinho);font-family:var(--tit);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase}
.secao:first-child{margin-top:4px}
.secao:before{content:"❧";color:var(--ouro);font-size:15px;letter-spacing:0}
.secao:after{content:"";flex:1;height:1px;background:var(--ouro);opacity:.7}
.secao .extra{order:3;font-family:var(--serif);letter-spacing:0;text-transform:none;font-size:13px;color:var(--tinta2);font-style:italic}
.cartao{background:var(--campo);border:1px solid var(--ouro);border-radius:10px;box-shadow:var(--sombra)}
.faixa{color:var(--faixa);font-family:var(--tit);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 8px;text-align:center}
.sub{color:var(--tinta2);font-style:italic;font-size:13px}
.ok{color:var(--verde)} .erro{color:var(--vinho)}
/* vitais */
.vitais{display:grid;gap:8px}
.vital{display:grid;grid-template-columns:76px 1fr auto;align-items:center;overflow:hidden}
.vital .rot{align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--faixa);font-family:var(--tit);font-size:12px;letter-spacing:.12em}
.vital .val{padding:6px 12px}
.vital .val b{font-size:26px}
.vital .val small{color:var(--tinta2);font-size:14px}
.vital .barra{height:5px;border-radius:3px;background:var(--perg2);margin-top:3px;overflow:hidden}
.vital .barra i{display:block;height:100%}
.passos{display:flex;gap:4px;padding:6px}
.passos button{width:40px;height:40px;border-radius:9px;border:1px solid var(--linha);background:var(--perg);font-size:15px}
.grade{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.caixa{text-align:center;overflow:hidden}
.caixa b{display:block;font-size:22px;padding:4px 2px 0}
.caixa small{display:block;color:var(--tinta2);font-size:11.5px;font-style:italic;padding:0 4px 6px;min-height:20px}
/* atributos */
.atr{text-align:center;overflow:hidden;position:relative}
.atr .total{font-size:30px;font-weight:600;line-height:1.1;padding-top:4px}
.atr .info{font-size:12.5px;color:var(--tinta2)}
.atr .info .vant{color:var(--verde);font-weight:600}
.atr .ctrl{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--linha);margin-top:6px}
.atr .ctrl button{width:44px;height:38px;border:0;background:transparent;font-size:20px;color:var(--vinho)}
.atr .ctrl span{font-size:12px;color:var(--tinta2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;border:1px solid var(--linha);background:var(--campo);font-size:13.5px;margin:0 4px 6px 0}
.chip.on{background:var(--verde);color:var(--faixa);border-color:var(--verde)}
/* listas */
.lista{border:1px solid var(--ouro);border-radius:10px;overflow:hidden;background:var(--campo)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--linha);min-height:48px}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .tx b{font-weight:600}
.item .tx small{display:block;color:var(--tinta2);font-size:13px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .num{font-weight:700;font-size:17px;white-space:nowrap}
.item.bloq{opacity:.62}
.item.bloq .tx small{color:var(--vinho);white-space:normal}
.marca{width:24px;text-align:center;font-weight:700}
.cab{display:flex;padding:6px 12px;color:var(--faixa);font-family:var(--tit);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.check{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ouro);display:flex;align-items:center;justify-content:center;flex:none;background:var(--perg)}
.check.on{background:var(--verde);border-color:var(--verde);color:var(--faixa)}
.check.on:after{content:"✓";font-weight:700}
/* armas */
.arma{padding:12px;margin-bottom:10px}
.arma.a0{background:var(--rosa)} .arma.a1{background:var(--agua)}
.arma .linha1{display:flex;align-items:center;gap:8px}
.arma .linha1 .sel{flex:1}
.arma dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:10px 0 4px}
.arma dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.arma dd{margin:0;font-weight:600}
.sel{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--ouro);background:var(--campo);min-height:46px}
.sel:after{content:"▾";color:var(--vinho)}
.sel.vazio{color:var(--tinta2);font-style:italic}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--ouro);background:var(--fundo2);color:var(--ouro2);min-height:44px;font-size:15px}
.botao.prim{background:var(--vinho);border-color:var(--vinho);color:var(--faixa)}
.botao.leve{background:var(--campo);color:var(--tinta)}
.botao[disabled]{opacity:.45}
.linhabts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details.acoes{margin-top:8px;border-top:1px dashed var(--linha);padding-top:6px}
details.acoes summary{color:var(--vinho);font-weight:600;list-style:none;padding:6px 0}
details.acoes summary:before{content:"📖 "}
.acao{padding:6px 0;border-bottom:1px solid var(--linha);font-size:14.5px;line-height:1.4}
.acao.sub{padding-left:16px}
.acao b{color:var(--vinho)}
/* avisos */
.avisos{list-style:none;margin:0;padding:0}
.avisos li{padding:8px 12px 8px 30px;position:relative;border-bottom:1px solid var(--linha);font-size:14.5px}
.avisos li:last-child{border-bottom:0}
.avisos li:before{position:absolute;left:10px;top:8px}
.avisos li.erro:before{content:"•";font-weight:700}
.avisos li.info{color:var(--tinta2)} .avisos li.info:before{content:"ℹ"}
.avisos li.tudo{color:var(--verde)} .avisos li.tudo:before{content:"✓"}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--fundo);border-top:1px solid var(--ouro);display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;color:#9fae9f;padding:8px 0 7px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--serif)}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--ouro2)}
.nav button.on i{transform:translateY(-1px)}
/* folhas (bottom sheets) */
.veu{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;display:flex;flex-direction:column;background:var(--perg);
  border-top-left-radius:16px;border-top-right-radius:16px;border-top:2px solid var(--ouro);transform:translateY(105%);transition:transform .22s ease-out;
  padding-bottom:env(safe-area-inset-bottom)}
.folha.on{transform:none}
.folha .alca{width:44px;height:5px;border-radius:3px;background:var(--linha);margin:8px auto 2px}
.folha header{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.folha header h3{flex:1;margin:0;font-family:var(--tit);font-size:16px;letter-spacing:.06em;color:var(--vinho)}
.folha .corpo{overflow:auto;padding:0 14px 16px;-webkit-overflow-scrolling:touch}
.folha .rodape{padding:10px 14px;border-top:1px solid var(--linha);display:flex;gap:8px}
.folha .rodape .botao{flex:1}
.busca{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ouro);background:var(--campo);margin-bottom:8px}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros select{padding:7px 8px;border-radius:9px;border:1px solid var(--linha);background:var(--campo);flex:none}
.contagem{font-size:12.5px;color:var(--tinta2);font-style:italic;margin:2px 2px 8px}
.desc{line-height:1.5;font-size:15px}
.desc h4{margin:14px 0 2px;color:var(--vinho);font-size:15px}
.meta{color:var(--tinta2);font-size:13.5px;margin:2px 0 6px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:var(--fundo2);color:var(--faixa);
  border:1px solid var(--ouro);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.campo{display:block;margin:10px 0}
.campo span{display:block;font-size:12.5px;color:var(--tinta2);margin-bottom:3px}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ouro);background:var(--campo)}
.vazio-msg{text-align:center;padding:26px 16px;color:var(--tinta2);font-style:italic}
.capa{text-align:center;padding:40px 18px}
.capa h1{font-family:var(--tit);color:var(--vinho);letter-spacing:.08em;font-size:24px;margin:8px 0}
.capa .orn{color:var(--ouro);font-size:36px}
.portao{display:flex;align-items:center;gap:8px;margin:6px 0}
.portao .r{width:86px;font-size:13px;color:var(--faixa);text-align:center;border-radius:6px;padding:4px 0;font-family:var(--tit);letter-spacing:.06em}
.bolinha{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ouro);background:var(--campo)}
.bolinha.on.s{background:var(--c-vigor);border-color:var(--c-vigor)}
.bolinha.on.f{background:var(--c-vida);border-color:var(--c-vida)}
input[type=number]{-moz-appearance:textfield}
@media (min-width:700px){ .pagina{max-width:760px;margin:8px auto 0} .g4m{grid-template-columns:repeat(4,1fr)!important} }
/* modo jogo / edição */
.jogo .so-ed{display:none!important}
.faixa-modo{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:6px 8px 6px 12px;border-radius:10px;background:var(--agua);border:1px solid var(--linha);font-size:13px}
.faixa-modo.ed{background:var(--rosa)}
.faixa-modo span{flex:1;line-height:1.3}
.faixa-modo button{border:1px solid var(--ouro);background:var(--campo);color:var(--tinta);border-radius:16px;padding:6px 12px;font-family:var(--serif);font-size:13.5px;font-weight:700;white-space:nowrap}
/* bolsa */
.barra.grossa{height:12px;border-radius:6px;background:var(--perg2);overflow:hidden}
.barra.grossa i{display:block;height:100%}
.cartao.dinheiro{display:flex;align-items:baseline;gap:10px;padding:12px 14px;margin-top:10px;border-left:6px solid var(--c-per)}
.cartao.dinheiro span{font-family:var(--tit);font-size:13px;color:var(--c-per)}
.cartao.dinheiro b{flex:1;font-size:19px}
.cartao.dinheiro small{color:var(--tinta2);font-style:italic;font-size:12px}
/* sessão do mestre */
.mesa{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:29;display:flex;gap:6px;padding:6px 8px;background:var(--fundo2);border-top:1px solid var(--ouro)}
.mesa .info{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--faixa);font-family:var(--serif);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mesa .mao{border:1px solid var(--ouro);background:var(--ouro2);color:#2d2015;border-radius:18px;padding:6px 14px;font-weight:700;font-family:var(--serif);font-size:14px}
.mesa .mao.on{background:var(--vinho);color:#fff}
body.com-mesa{padding-bottom:calc(108px + env(safe-area-inset-bottom))}
body.com-mesa .toast{bottom:calc(124px + env(safe-area-inset-bottom))}
.lista.mestre .item{background:var(--rosa)}
.toast hr{border:0;border-top:1px solid var(--ouro);opacity:.5;margin:6px 0}
.botao.mini{min-height:32px;padding:4px 12px;font-size:13.5px;margin-right:8px}
.mesa.vez{background:var(--vinho)}
.mesa.vez .info{color:#fff}

/* modo noturno: botões principais legíveis (texto 6,1:1) */
html.noite .botao.prim{background:#a5423a;border-color:#d27467;color:#fff}
html.noite .mesa.vez,html.noite .mesa .mao.on{background:#a5423a;color:#fff}
/* turno */
.cartao.turno{padding:12px}
.turno .tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.turno .tipo{border:1px solid var(--linha);background:var(--campo);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tinta);min-height:56px}
.turno .tipo b{font-size:13px}
.turno .tipo.cheio{background:var(--perg2);opacity:.75}
.pts{display:inline-flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pts i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ouro);display:inline-block}
.pts i.gasto{background:var(--vinho);border-color:var(--vinho)}
.pts i.extra{border-color:var(--vinho);border-style:dashed}
.pts.grande i{width:14px;height:14px}
.lista .item .botao.mini{margin-left:6px}
/* ações da arma e recursos */
.acoes-arma{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip-acao{border:1px solid var(--ouro);background:var(--campo);color:var(--tinta);border-radius:16px;padding:6px 11px;font-size:14px;font-family:var(--serif);display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-height:40px;justify-content:center}
.chip-acao small{font-size:11px;color:var(--tinta2);font-style:italic}
.chip-acao.passiva{border-style:dashed;opacity:.85}
.recursos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.recurso{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);border-radius:18px;padding:2px 4px;background:var(--campo);font-size:14px}
.recurso button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ouro);background:transparent;color:var(--vinho);font-size:18px;line-height:1}
/* condições compactas */
.conds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cond{position:relative;overflow:hidden;border:1px solid var(--linha);background:var(--campo);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--tinta);font-family:var(--serif);font-size:14px;min-height:44px}
.cond span{font-variant-numeric:tabular-nums;color:var(--tinta2)}
.cond.on{border-color:var(--vinho)}
.cond.on span{color:var(--vinho);font-weight:700}
.cond i{position:absolute;left:0;bottom:0;height:3px;background:var(--vinho)}
/* dinheiro */
.moedas{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
/* alma */
.cartao.hab{padding:12px 14px;margin-bottom:8px}
.topo-hab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topo-hab b{font-size:17px;color:var(--vinho)}
/* passo a passo */
.passos-wz{display:flex;gap:4px}
.passos-wz i{flex:1;height:4px;border-radius:2px;background:var(--linha)}
.passos-wz i.feito{background:var(--ouro)}
.passos-wz i.atual{background:var(--vinho)}
/* barra de abas com Alma (7 abas) */
.nav{grid-template-columns:none;display:flex}
.nav button{flex:1;min-width:0}
@media (max-width:360px){.nav button{font-size:10px}.nav button i{font-size:18px}}
/* impressão */
#impressao{display:none}
@media print{
  html.imprimindo body{background:#fff;color:#000;padding:0}
  html.imprimindo body>*:not(#impressao){display:none!important}
  html.imprimindo #impressao{display:block}
  .impr{font-family:Georgia,"Times New Roman",serif;font-size:10.5pt;color:#000}
  .impr h1{font-size:18pt;margin:0 0 2mm;color:#5a1a1a}
  .impr h2{font-size:11pt;margin:5mm 0 1.5mm;color:#5a1a1a;border-bottom:1px solid #b39552;break-after:avoid}
  .impr table{width:100%;border-collapse:collapse;margin:1mm 0;break-inside:avoid}
  .impr th,.impr td{border:1px solid #c9b98f;padding:1mm 1.5mm;text-align:left;vertical-align:top}
  .impr th{background:#efe6cf;font-size:9pt}
  .impr .linha{margin:1mm 0}
  .impr .rodape-impr{margin-top:6mm;font-size:8pt;color:#666}
  @page{size:A4;margin:12mm}
}
</style>
</head>

<script>window.DADOS={"armas":[{"nome":"Adaga","ataque":"DES","req":[{"attr":"DES","base":14,"por_nivel":5},{"attr":"FOR","base":8,"por_nivel":1}],"tabela":[{"nivel":1,"dano":"1d4","tipo":"Perfurante","propriedades":0,"critico":"19","espaco":4,"vigor":null},{"nivel":2,"dano":"1d6","tipo":"Perfurante","propriedades":1,"critico":"19","espaco":4,"vigor":null},{"nivel":3,"dano":"2d4","tipo":"Perfurante","propriedades":1,"critico":"18","espaco":5,"vigor":null},{"nivel":4,"dano":"2d4 + 2","tipo":"Perfurante","propriedades":2,"critico":"18","espaco":5,"vigor":null},{"nivel":5,"dano":"2d6 + 1","tipo":"Perfurante","propriedades":2,"critico":"18","espaco":5,"vigor":null},{"nivel":6,"dano":"2d6 + 2","tipo":"Perfurante","propriedades":3,"critico":"17","espaco":6,"vigor":null},{"nivel":7,"dano":"3d6","tipo":"Perfurante","propriedades":3,"critico":"17","espaco":6,"vigor":null},{"nivel":8,"dano":"3d6 + 1d4","tipo":"Perfurante","propriedades":4,"critico":"17","espaco":6,"vigor":null},{"nivel":9,"dano":"3d6 + 2d4","tipo":"Perfurante","propriedades":4,"critico":"16","espaco":7,"vigor":null},{"nivel":10,"dano":"4d6 + 2d4","tipo":"Perfurante","propriedades":5,"critico":"16","espaco":7,"vigor":null}],"uso_duplo":true,"vigor":false,"descricao":"Leves e afiadas, projetadas para ataques rápidos e furtivos. Favorecem a mobilidade e golpes precisos em pontos vulneráveis, sacrificando alcance e proteção. O sistema de combate das adagas gira em torno do Modo Frenesi, que permite o usuário a causar uma quantidade massiva de dano caso cumpra alguns pré-requisitos.","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível da sua adaga. Cada acerto gera 1 Fragmento de Combo. Se errar, todos os fragmentos acumulados no turno são perdidos.","sub":false},{"nome":"Ataque de Saque","texto":"Caso você seja o primeiro na iniciativa de uma rodada, você pode gastar uma ação bônus para dobrar seu movimento e causar um golpe com um acerto garantido, podendo gastar o restante do movimento após o ataque. Se usado como primeiro ataque do turno, gera 2 Fragmentos de Combo.","sub":false},{"nome":"Faca de Dois Gumes","texto":"Você pode utilizar duas ações “Atacar” utilizando o mesmo acerto, gastando 1 Fragmento de Combo. Se o teste de ataque for um sucesso, recupera o fragmento gasto e o próximo ataque recebe bônus de crítico (x2 -> x3). Se errar, o fragmento é perdido e o próximo ataque sofre desvantagem.","sub":false},{"nome":"Corrente de Lâminas","texto":"Caso utilize a sequência Atacar -> Faca de Dois Gumes -> Ataque de Saque em um mesmo turno, todos os golpes da corrente causam +1 nível de dano. Se errar qualquer ataque, a corrente é quebrada e todos os fragmentos são perdidos.","sub":false},{"nome":"Modo Frenesi","texto":"Caso acerte 3 ataques consecutivos em um turno, você pode gastar uma ação bônus e 3 Fragmentos de Combo para entrar em Modo Frenesi. Enquanto estiver no modo, cada acerto consome 1 fragmento para aumentar o dano em um nível. Se terminar o turno sem fragmentos, o modo se encerra.","sub":false},{"nome":"Dança Frenética","texto":"Caso esteja em Modo Frenesi e possua ao menos 5 Fragmentos de Combo, você pode gastar todos para ativar a Dança Frenética. Todas as suas ações comuns e bônus se tornam ataques, todos resolvidos em um único teste de acerto. Após isso, seu turno acaba e você fica imóvel até o próximo turno, além de não poder usar ações bônus no turno seguinte.","sub":false},{"nome":"Passo das Sombras","texto":"Caso utilize a sequência Ataque de Saque → Faca De Dois Gumes, você pode atravessar o espaço de um inimigo sem provocar ataque de oportunidade.","sub":false},{"nome":"Lâmina Fantasma","texto":"Caso utilize a sequência Faca De Dois Gumes → Atacar, você pode gastar 2 Fragmentos de Combo para criar um ataque ilusório. O inimigo deve rolar resistência com Reflexos; se falhar, sofre dano adicional de um ataque nível inferior a sua arma e fica Confuso.","sub":false},{"nome":"Execução Silenciosa","texto":"Caso utilize a sequência Atacar → Ataque de Saque → Faca De Dois Gumes contra um inimigo com menos de 25% da vida e tiver mais de 4 fragmentos de combo, você pode gastar todos os Fragmentos de Combo acumulados para causar um golpe crítico automático. Se o inimigo sobreviver, você sofre −2 de CA até o próximo turno.","sub":false}]},{"nome":"Espada","ataque":"FOR","req":[{"attr":"DES","base":10,"por_nivel":2},{"attr":"FOR","base":10,"por_nivel":5}],"tabela":[{"nivel":1,"dano":"1d6","tipo":"Cortante","propriedades":0,"critico":"19","espaco":8,"vigor":null},{"nivel":2,"dano":"1d6 + 1","tipo":"Cortante","propriedades":1,"critico":"19","espaco":8,"vigor":null},{"nivel":3,"dano":"2d4","tipo":"Cortante","propriedades":1,"critico":"18","espaco":9,"vigor":null},{"nivel":4,"dano":"2d4 + 1","tipo":"Cortante","propriedades":2,"critico":"18","espaco":9,"vigor":null},{"nivel":5,"dano":"2d6 + 1","tipo":"Cortante","propriedades":2,"critico":"18","espaco":9,"vigor":null},{"nivel":6,"dano":"2d8 + 1","tipo":"Cortante","propriedades":3,"critico":"18","espaco":10,"vigor":null},{"nivel":7,"dano":"2d10 + 1","tipo":"Cortante","propriedades":3,"critico":"18","espaco":10,"vigor":null},{"nivel":8,"dano":"2d12 + 1","tipo":"Cortante","propriedades":4,"critico":"18","espaco":10,"vigor":null},{"nivel":9,"dano":"3d10 + 1","tipo":"Cortante","propriedades":4,"critico":"18","espaco":11,"vigor":null},{"nivel":10,"dano":"6d6 + 1","tipo":"Cortante","propriedades":5,"critico":"18","espaco":11,"vigor":null}],"uso_duplo":true,"vigor":false,"descricao":"Espadas longas e equilibradas feitas para ataques em sequência e técnicas de corte fluídas. Combina alcance razoável com mobilidade moderada.","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível da sua espada.","sub":false},{"nome":"Preparar Postura — Defesa","texto":"Como uma reação ou ação bônus, você entra em uma postura defensiva, permitindo receber resistência a um tipo de dano físico que preferir, apenas no próximo ataque que receber. Receber o golpe tira sua postura.","sub":false},{"nome":"Preparar Postura — Ataque","texto":"Como uma ação bônus, você entra em uma postura ofensiva, lhe concedendo vantagem no próximo teste de Ataque que realizar. Acertar este ataque tira sua postura.","sub":false},{"nome":"Preparar Postura — Precisão","texto":"Como uma ação bônus, você entra em uma postura de precisão. Enquanto estiver nela, você só pode realizar um ataque por turno, mas este ataque causa +2 nível de dano se acertar. Errar o ataque tira sua postura.","sub":false},{"nome":"Janela de Oportunidade","texto":"Sempre que um aliado causar um golpe você pode, como uma reação, se mover até ele ou ao flanco inimigo, e usar a ação Atacar, utilizando o acerto do seu aliado.","sub":false},{"nome":"Estocada Rápida","texto":"Caso esteja na Postura de Ataque e acerte um golpe, pode gastar sua ação bônus para realizar uma segunda estocada com desvantagem, mas que causa +1 nível de dano se acertar.","sub":false},{"nome":"Inspirar","texto":"Você pode gastar uma Ação Completa para inspirar seus aliados, fazendo com que todos recebam vantagem em um teste que escolherem em seu próximo turno.","sub":false},{"nome":"Riposte","texto":"Caso esteja na Postura de Defesa e um inimigo erre um ataque contra você, pode gastar sua reação para realizar um contra-ataque imediato com vantagem.","sub":false},{"nome":"Duelo Honrado","texto":"Caso alterne entre duas posturas diferentes em um mesmo turno e acerte ambos os ataques, você pode declarar um Duelo Honrado contra o inimigo. Enquanto estiver em duelo, você e o inimigo só podem atacar um ao outro até o fim do próximo turno. Seus ataques contra esse inimigo recebem vantagem, mas você não pode receber ajuda de aliados.","sub":false}]},{"nome":"Espada Grande","ataque":"FOR","req":[{"attr":"DES","base":14,"por_nivel":2},{"attr":"FOR","base":16,"por_nivel":5}],"tabela":[{"nivel":1,"dano":"1d12","tipo":"Cortante","propriedades":0,"critico":"20","espaco":10,"vigor":null},{"nivel":2,"dano":"2d8","tipo":"Cortante","propriedades":1,"critico":"20","espaco":10,"vigor":null},{"nivel":3,"dano":"2d10","tipo":"Cortante","propriedades":1,"critico":"20","espaco":11,"vigor":null},{"nivel":4,"dano":"2d10 + 2","tipo":"Cortante","propriedades":2,"critico":"20","espaco":11,"vigor":8},{"nivel":5,"dano":"3d8 + 2","tipo":"Cortante","propriedades":2,"critico":"19","espaco":11,"vigor":null},{"nivel":6,"dano":"3d10 + 2","tipo":"Cortante","propriedades":3,"critico":"19","espaco":12,"vigor":null},{"nivel":7,"dano":"4d8 + 3","tipo":"Cortante","propriedades":3,"critico":"19","espaco":12,"vigor":null},{"nivel":8,"dano":"4d10 + 3","tipo":"Cortante","propriedades":4,"critico":"19","espaco":12,"vigor":10},{"nivel":9,"dano":"5d10 + 2","tipo":"Cortante","propriedades":4,"critico":"19","espaco":13,"vigor":null},{"nivel":10,"dano":"6d10","tipo":"Cortante","propriedades":5,"critico":"19","espaco":13,"vigor":null}],"uso_duplo":false,"vigor":true,"descricao":"Espadas Grandes são pesadas, feitas para ataques poderosos e técnicas de corte destruidoras. Seu alto peso permite construir Momentum entre golpes, recompensando quem mantém a pressão sem se expor demais. Combina alcance razoável com mobilidade moderada. Esta arma possui a propriedade Vigor.","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível da sua Espada Grande.","sub":false},{"nome":"Movimento Tático","texto":"Sempre que utilizar a ação “Atacar”, você aproveita o peso do seu ataque e pode se mover 1,5m.","sub":false},{"nome":"Criar Momentum","texto":"Sempre que acertar um golpe, você recebe 1 acúmulo de Momentum, até um máximo de 5. A cada acúmulo, você ganha +1 de acerto. Se errar um ataque, todos os acúmulos são perdidos.","sub":false},{"nome":"Gastar Momentum","texto":"Você, ao ter 5 acúmulos de Momentum, pode gastar uma ação completa para gastar todos de uma única vez. Com isto, recebe um crítico garantido no seu próximo golpe e ele não gastará Vigor.","sub":false},{"nome":"Passiva: Impacto Crescente","texto":"Caso mantenha 3 ou mais acúmulos de Momentum, seus ataques passam a causar +1 nível de dano. Se perder Momentum, o bônus desaparece.","sub":false},{"nome":"Golpe de Pressão","texto":"Caso esteja com 4 acúmulos de Momentum, você pode gastar uma ação bônus para realizar um ataque adicional.","sub":false},{"nome":"Golpe em Arco","texto":"Caso esteja com 3 acúmulos de Momentum, você pode gastar uma ação completa para realizar um corte em arco, atingindo todos os inimigos em alcance frontal. Cada inimigo atingido gera 1 acúmulo adicional de Momentum.","sub":false},{"nome":"Clivagem Final","texto":"Caso esteja com 5 acúmulos de Momentum e pelo menos metade do seu Vigor restante, você pode gastar todos os acúmulos de Momentum para realizar um corte devastador em linha reta em 4,5 metros. Este ataque atravessa todos os inimigos no caminho, ignorando defesas.","sub":false}]},{"nome":"Katana","ataque":"DES","req":[{"attr":"DES","base":16,"por_nivel":5},{"attr":"FOR","base":10,"por_nivel":2}],"tabela":[{"nivel":1,"dano":"1d6","tipo":"Cort. ou Perf.","propriedades":0,"critico":"18","espaco":7,"vigor":null},{"nivel":2,"dano":"1d6 + 1","tipo":"Cort. ou Perf.","propriedades":1,"critico":"18","espaco":7,"vigor":null},{"nivel":3,"dano":"1d10","tipo":"Cort. ou Perf.","propriedades":1,"critico":"17","espaco":8,"vigor":null},{"nivel":4,"dano":"1d10 + 1","tipo":"Cort. ou Perf.","propriedades":2,"critico":"17","espaco":8,"vigor":null},{"nivel":5,"dano":"2d6 + 1","tipo":"Cort. ou Perf.","propriedades":2,"critico":"17","espaco":8,"vigor":null},{"nivel":6,"dano":"3d6","tipo":"Cort. ou Perf.","propriedades":3,"critico":"17","espaco":9,"vigor":null},{"nivel":7,"dano":"2d10 + 1","tipo":"Cort. ou Perf.","propriedades":3,"critico":"17","espaco":9,"vigor":null},{"nivel":8,"dano":"3d8 + 1","tipo":"Cort. ou Perf.","propriedades":4,"critico":"16","espaco":9,"vigor":null},{"nivel":9,"dano":"3d10 + 1","tipo":"Cort. ou Perf.","propriedades":4,"critico":"16","espaco":10,"vigor":null},{"nivel":10,"dano":"3d10 + 1d8","tipo":"Cort. ou Perf.","propriedades":5,"critico":"16","espaco":10,"vigor":null}],"uso_duplo":true,"vigor":false,"descricao":"A lâmina da disciplina. Corta com graça e fúria, exigindo foco absoluto. Favorece críticos e duelos onde cada movimento conta.","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível da sua Katana.","sub":false},{"nome":"Movimento tático","texto":"Sempre que utilizar a ação atacar, você pode se mover 1,5m.","sub":false},{"nome":"Dedicação","texto":"Você gasta uma ação bônus e realiza um teste de Prevalência contra a Vontade do oponente. Um sucesso faz com que você cause um nível de dano acima da arma. Este efeito reinicia por rodada. Enquanto estiver em Dedicação, várias técnicas exclusivas podem ser ativadas.","sub":false},{"nome":"Contragolpe","texto":"Como uma reação, você pode fazer um teste de acerto contra o acerto do golpe do inimigo. Se for maior, você apara o golpe, realiza uma ação “Atacar”, e o dano da ação será triplicado para a Postura do inimigo.","sub":false},{"nome":"Postura da Serenidade","texto":"Ao entrar em Dedicação, você pode escolher ficar imóvel até o fim do turno. Se fizer isso, seu próximo ataque no turno seguinte recebe vantagem e +2 de acerto.","sub":false},{"nome":"Corte Crescente","texto":"Se acertar dois ataques consecutivos durante o efeito de Dedicação, pode gastar uma ação bônus para realizar um terceiro ataque imediato. Este golpe causa +1 nível de dano e ignora resistência física.","sub":false}]},{"nome":"Machado Grande","ataque":"FOR","req":[{"attr":"DES","base":15,"por_nivel":0},{"attr":"FOR","base":16,"por_nivel":5}],"tabela":[{"nivel":1,"dano":"2d6","tipo":"Cortante","propriedades":0,"critico":"19","espaco":10,"vigor":null},{"nivel":2,"dano":"2d8","tipo":"Cortante","propriedades":1,"critico":"19","espaco":10,"vigor":null},{"nivel":3,"dano":"3d6","tipo":"Cortante","propriedades":1,"critico":"18","espaco":11,"vigor":null},{"nivel":4,"dano":"3d8","tipo":"Cortante","propriedades":2,"critico":"18","espaco":11,"vigor":8},{"nivel":5,"dano":"3d10","tipo":"Cortante","propriedades":2,"critico":"18","espaco":11,"vigor":null},{"nivel":6,"dano":"3d12","tipo":"Cortante","propriedades":3,"critico":"18","espaco":12,"vigor":null},{"nivel":7,"dano":"4d10","tipo":"Cortante","propriedades":3,"critico":"18","espaco":12,"vigor":null},{"nivel":8,"dano":"4d12","tipo":"Cortante","propriedades":4,"critico":"18","espaco":12,"vigor":10},{"nivel":9,"dano":"5d12","tipo":"Cortante","propriedades":4,"critico":"18","espaco":13,"vigor":null},{"nivel":10,"dano":"6d12","tipo":"Cortante","propriedades":5,"critico":"18","espaco":13,"vigor":null}],"uso_duplo":false,"vigor":true,"descricao":"Sempre que você prepara um ataque com o Machado Grande, acumula Força de Impacto. Essa força pode ser descarregada em golpes devastadores, mas exige tempo e deixa você vulnerável. Esta arma possui a derivação Vigor.","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível do seu Machado Grande.","sub":false},{"nome":"Preparar Impacto","texto":"Você gasta uma ação bônus para que seu próximo golpe cause 1 nível acima de dano. Esta habilidade pode ser usada até 3 vezes no mesmo golpe.","sub":false},{"nome":"Gritar","texto":"Você grita por guerra, fazendo um teste de acerto como se fosse um ataque. Caso tenha sucesso, o alvo recebe vantagem contra você no próximo turno, mas você também recebe vantagem contra ele.","sub":false},{"nome":"Rugido de Titã","texto":"Ao usar Gritar com sucesso, você pode gastar uma ação bônus para ganhar resistência a todos os tipos de dano físico até o fim do próximo turno.","sub":true},{"nome":"Passiva: Berserk","texto":"Ao ficar com metade de sua vida máxima, você recebe o dobro de seu movimento e seus ataques passam a causar +1 nível de dano, mas você perde -2 de CA até sair do estado.","sub":false},{"nome":"Golpe Ascendente","texto":"Se estiver em Berserk, pode gastar uma ação bônus para realizar um ataque vertical que lança o inimigo para cima até o turno inimigo. Aliados recebem vantagem ao atacar esse inimigo até ele cair.","sub":true},{"nome":"Golpe Final","texto":"Você automaticamente entra no portão da morte com 2 falhas, mas faz uma ação Atacar com crítico garantido e o multiplicador do crítico é aumentado para 5x.","sub":false},{"nome":"Ira Indomável","texto":"Se entrar no Golpe Final, você pode escolher gastar todo o seu Vigor restante. Para cada 20 pontos gastos, o multiplicador do crítico aumenta em +1x, até no máximo 10x.","sub":true}]},{"nome":"Bastão","ataque":"DES","req":[{"attr":"DES","base":16,"por_nivel":5},{"attr":"FOR","base":10,"por_nivel":2}],"tabela":[{"nivel":1,"dano":"1d6","tipo":"Impacto","propriedades":0,"critico":"19","espaco":6,"vigor":null},{"nivel":2,"dano":"1d6","tipo":"Impacto","propriedades":1,"critico":"19","espaco":6,"vigor":null},{"nivel":3,"dano":"1d8","tipo":"Impacto","propriedades":1,"critico":"18","espaco":7,"vigor":null},{"nivel":4,"dano":"2d4","tipo":"Impacto","propriedades":2,"critico":"18","espaco":7,"vigor":null},{"nivel":5,"dano":"2d6","tipo":"Impacto","propriedades":2,"critico":"18","espaco":7,"vigor":null},{"nivel":6,"dano":"2d6 + 1","tipo":"Impacto","propriedades":3,"critico":"18","espaco":8,"vigor":null},{"nivel":7,"dano":"2d8 + 1","tipo":"Impacto","propriedades":3,"critico":"18","espaco":8,"vigor":null},{"nivel":8,"dano":"2d10 + 1","tipo":"Impacto","propriedades":4,"critico":"18","espaco":8,"vigor":null},{"nivel":9,"dano":"3d8 + 1","tipo":"Impacto","propriedades":4,"critico":"18","espaco":9,"vigor":null},{"nivel":10,"dano":"5d6 + 1","tipo":"Impacto","propriedades":5,"critico":"17","espaco":9,"vigor":null}],"uso_duplo":true,"vigor":false,"descricao":"","acoes":[{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo usando o nível de seu bastão","sub":false},{"nome":"Remada","texto":"Como uma ação bônus, você pode se atirar 3m/2q para qualquer direção (incluindo para cima)","sub":false},{"nome":"Empurrão","texto":"Como uma ação bônus, sua próxima ação Atacar causará 1 nível a menos de dano e forçará o alvo do ataque a fazer um teste de Fortitude (DT 10 + Bônus de Combate de Destreza + nível / 3), em uma falha o alvo é empurrado 3m/2q para trás.","sub":false},{"nome":"Derrubada","texto":"Como uma ação bônus, sua próxima ação Atacar causará 1 nível a menos de dano e forçará o alvo do ataque a fazer um teste de Reflexos (DT 10 + Bônus de Combate de Destreza + nível / 3), em uma falha o alvo recebe o efeito Caído. Esta habilidade não pode ser usada caso o inimigo seja 2 vezes maior que você.","sub":false},{"nome":"Implicância","texto":"Como uma ação bônus e uma reação, você pode aplicar desvantagem em um alvo a 1.5m/1q prestes a fazer um teste de Reflexos, ou pode mantê-lo no chão caso tenha acabado de se levantar.","sub":false},{"nome":"Distância Segura","texto":"Como uma reação, seu bastão aumenta de tamanho até 9m, e caso alcance um aliado, você pode empurrar ele até a distância percorrida pelo bastão, além de 1,5m/1q adicional.","sub":false},{"nome":"Nota","texto":"Ao alcançar 50 de Destreza, você aprende a usar o bastão utilizando ambas as mãos e os pés, possibilitando a novas acrobacias e maneiras de usar.","sub":false},{"nome":"Manuseio Perfeito","texto":"Você aprende a usar o bastão em qualquer posição, e consegue trocar o membro que está utilizando como uma ação livre. Você se torna imune a golpes de oportunidade.","sub":false},{"nome":"Coice","texto":"Ao realizar um golpe de cima para baixo, em formato de lua, você causará 2 níveis a menos de dano, e forçará o alvo do ataque a fazer um teste de Fortitude (DT 10 + Bônus de Combate de Destreza + nível / 3), em uma falha o alvo recebe o efeito Confuso.","sub":false},{"nome":"Aproximação","texto":"Como uma reação, seu bastão aumenta de tamanho até 9m, e caso alcance um aliado, ele pode segurar em sua arma e, ao ela voltar ao seu tamanho normal, o aliado vai a você, ficando em 1,5m/1q adjacente.","sub":false}]},{"nome":"Lança-Arma","ataque":"FOR","req":[{"attr":"DES","base":14,"por_nivel":2},{"attr":"FOR","base":16,"por_nivel":5}],"tabela":[{"nivel":1,"dano":"1d10","tipo":"Impacto","propriedades":0,"critico":"19","espaco":8,"vigor":null},{"nivel":2,"dano":"1d12","tipo":"Impacto","propriedades":1,"critico":"19","espaco":8,"vigor":null},{"nivel":3,"dano":"2d6 + 1","tipo":"Impacto","propriedades":1,"critico":"18","espaco":8,"vigor":null},{"nivel":4,"dano":"2d8","tipo":"Impacto","propriedades":2,"critico":"18","espaco":10,"vigor":null},{"nivel":5,"dano":"3d6","tipo":"Impacto","propriedades":2,"critico":"18","espaco":10,"vigor":null},{"nivel":6,"dano":"2d10 + 1","tipo":"Impacto","propriedades":3,"critico":"17","espaco":10,"vigor":null},{"nivel":7,"dano":"3d8","tipo":"Impacto","propriedades":3,"critico":"17","espaco":11,"vigor":null},{"nivel":8,"dano":"3d10","tipo":"Impacto","propriedades":4,"critico":"17","espaco":12,"vigor":null},{"nivel":9,"dano":"3d10 + 1","tipo":"Impacto","propriedades":4,"critico":"16","espaco":13,"vigor":null},{"nivel":10,"dano":"3d12 + 2","tipo":"Impacto","propriedades":5,"critico":"16","espaco":14,"vigor":null}],"uso_duplo":false,"vigor":false,"descricao":"Variante do lance que integra disparos explosivos internos às estocadas, misturando defesa e poder explosivo. Permite ataques de impacto únicos e rajadas com efeito de concussão, mas impõe limitações de mobilidade e gerenciamento de munição interna. Bom para controle e dano focalizado. Mecânica Única: Munição Interna","acoes":[{"nome":"•","texto":"Cada ataque básico carrega 1 cartucho de munição interna (máximo de 5).","sub":true},{"nome":"Essa munição pode ser gasta em explosões curtas","texto":"rajadas ou ataques massivos.","sub":true},{"nome":"Se a munição chegar a 0","texto":"você precisa gastar uma ação bônus para Recarregar, enchendo novamente até o máximo.","sub":true},{"nome":"Atacar","texto":"Como uma ação comum, você pode atacar o alvo causando o dano do nível do seu Lança-Arma.","sub":false},{"nome":"Explosão Curta","texto":"Sempre que acertar uma ação Atacar, você pode gastar 1 cartucho e uma ação bônus, disparando uma explosão que causa dano de 1 nível abaixo.","sub":false},{"nome":"Escudo","texto":"Sua arma já possui um escudo pequeno junto. Assim que você desbloquear escudos de níveis maiores, sua arma melhora automaticamente, até o Escudo Médio.","sub":false},{"nome":"Sinergia de Escudo","texto":"Sempre que bloquear um ataque com sucesso, você pode gastar 1 cartucho para realizar uma Explosão Curta imediata.","sub":true},{"nome":"Contra-Explosão","texto":"Se um inimigo acertar você, pode gastar 1 cartucho como reação para liberar uma explosão defensiva, causando dano de 3 niveis abaixo de concussão e empurrando o inimigo 3m para trás.","sub":false},{"nome":"Rajada de Fogo","texto":"Você pode gastar até 3 cartuchos em uma única ação comum, disparando uma sequência de explosões rápidas. Cada explosão causa dano de 2 níveis abaixo, mas acertar as 3 causa desvantagem a golpes direcionados a você no próximo turno.","sub":false},{"nome":"Sobrepressão","texto":"Se estiver com 5 cartuchos carregados, pode gastar uma ação bônus para entrar em estado de sobrepressão. Enquanto durar, cada ataque básico consome 1 cartucho e causa +1 nível de dano. O estado termina quando a munição acaba.","sub":false},{"nome":"Explosão Massiva","texto":"Após causar 5 golpes e acumular munição máxima, você pode gastar uma ação completa e todos os cartuchos, causando um disparo de 9m que inflige dano de 2 níveis acima da arma. Só pode ser usado uma vez por combate.","sub":false}]},{"nome":"Lâmina-Dínamo","ataque":"FOR","req":[{"attr":"DES","base":14,"por_nivel":2},{"attr":"FOR","base":16,"por_nivel":5}],"tabela":[{"nivel":1,"dano":"1d10","tipo":"Cort. ou Perf.","propriedades":0,"critico":"18","espaco":8,"vigor":null},{"nivel":2,"dano":"1d12","tipo":"Cort. ou Perf.",  um escudo pequeno junto. Assim que você desbloquear escudos de níveis maiores, sua arma melhora automaticamente, até o Escudo Médio. Você perde os efeitos do escudo na forma Dínamo.","sub":false},{"nome":"Troca Dínamo","texto":"Com 5 Cargas, você pode gastar uma ação comum para entrar na forma Machado-Dínamo, convertendo as Cargas em Frascos. Na forma Machado-Dínamo, a arma causa dano 1 nível acima. Voltar para Espada & Escudo custa uma ação bônus.","sub":false},{"nome":"Sobrecarga de Energia","texto":"Se ganhar Cargas enquanto já tem 5 Frascos, você entra em estado de Sobrecarga. Nesse estado, cada ataque básico causa +1 nível de dano, mas você perde 2 de CA até gastar todos os Frascos.","sub":false},{"nome":"Explosão Dínamo","texto":"Se você trocar para a forma Machado-Dínamo já tendo 5 Frascos, as Cargas excedentes explodem em volta de 3 metros de você, causando dano 2 níveis acima da sua arma, incluindo você. A explosão não remove a forma Machado-Dínamo.","sub":false},{"nome":"Descarga Elemental","texto":"Em forma Dínamo, você pode gastar 1 frasco em um ataque, aumentando o dano em +1 nível.","sub":false},{"nome":"Super Descarga Elemental","texto":"Se gastar todos os 5 Frascos em um único ataque de Machado-Dínamo, você causa uma explosão massiva que triplica o dano contra a Postura do inimigo. Após isso, você fica imóvel e não pode usar ações bônus no próximo turno.","sub":true},{"nome":"Recarga Defensiva","texto":"Se estiver em Espada & Escudo e usar o Escudo para bloquear um ataque, pode gastar uma ação bônus para recarregar 2 Frascos sem perder defesa.","sub":false},{"nome":"Escudo Energizado","texto":"Se gastar 2 Frascos enquanto estiver em Espada & Escudo, você fortalece o Escudo. Até o fim do próximo turno, qualquer ataque bloqueado gera 1 Frasco adicional e reduz o dano recebido em metade.","sub":false},{"nome":"Descarga Guardada","texto":"Se bloquear um ataque com sucesso usando o Escudo e estiver com 5 Frascos, pode gastar todos em uma única reação. Isso libera uma explosão defensiva que causa o dano da arma +1 nível acima em uma área de 3m e derruba inimigos próximos.","sub":false},{"nome":"Escudo Perfeito","texto":"Se realizar um Parry enquanto estiver com 5 Frascos, pode gastar todos para transformar o bloqueio em um contra-ataque devastador. Este golpe causa crítico automático e triplica o dano contra a Postura do inimigo.","sub":false},{"nome":"Sinergia Total","texto":"Se gastar pelo menos 1 Frasco em cada forma (Espada, Escudo e Machado) dentro de dois turnos consecutivos, você ativa Sinergia Total. Durante esse estado, todos os seus ataques consomem 1 Frasco automaticamente e causam +1 nível de dano. O estado termina quando os Frascos acabam.","sub":false},{"nome":"Explosão Suprema","texto":"Se estiver com Escudo Energizado, 5 Frascos carregados e em Sobrecarga ao mesmo tempo, pode gastar tudo em uma ação completa. Este ataque causa uma explosão suprema que atravessa todos os inimigos em linha reta de 3m, ignora defesas e causa dano crítico multiplicado por 4x. Após isso, você retorna automaticamente à forma Espada & Escudo com 0 Frascos e sem Vigor.","sub":false}]},{"nome":"Arco","ataque":"DES","req":[{"attr":"DES","base":16,"por_nivel":5},{"attr":"FOR","base":6,"por_nivel":1}],"tabela":[{"nivel":1,"dano":"1d6","tipo":"Perfurante","propriedades":0,"critico":"20","espaco":7,"vigor":null},{"nivel":2,"dano":"1d8","tipo":"Perfurante","propriedades":1,"critico":"20","espaco":7,"vigor":null},{"nivel":3,"dano":"1d10","tipo":"Perfurante","propriedades":1,"critico":"20","espaco":8,"vigor":null},{"nivel":4,"dano":"2d6","tipo":"Perfurante","propriedades":2,"critico":"19","espaco":8,"vigor":null},{"nivel":5,"dano":"2d8","tipo":"Perfurante","propriedades":2,"critico":"19","espaco":8,"vigor":null},{"nivel":6,"dano":"2d8 + 2","tipo":"Perfurante","propriedades":3,"critico":"19","espaco":9,"vigor":null},{"nivel":7,"dano":"3d6 + 2","tipo":"Perfurante","propriedades":3,"critico":"18","espaco":9,"vigor":null},{"nivel":8,"dan requisito":"","descricao":"Descansos longos na Base recuperam 10 pontos de Vigor adicionais para todos."},{"nome":"Horta Musical","categoria":"Talentos de Base e Pasto","nivel":6,"requisito":"Mão Verde","descricao":"Música constante na horta concede +0,2 de qualidade por dia (máximo 1,5)."},{"nome":"Pecuarista","categoria":"Talentos de Base e Pasto","nivel":6,"requisito":"Voz dos Animais","descricao":"Os animais da sua Base precisam ser alimentados 1 vez por dia, em vez de 2."},{"nome":"Defensor da Base","categoria":"Talentos de Base e Pasto","nivel":8,"requisito":"","descricao":"Lutando dentro da sua Base, você tem +2 de CA e vantagem na iniciativa."},{"nome":"Polinizador","categoria":"Talentos de Base e Pasto","nivel":8,"requisito":"Mão Verde","descricao":"Introduzir polinizadores concede +2 de qualidade em vez de +1."},{"nome":"Arquiteto","categoria":"Talentos de Base e Pasto","nivel":10,"requisito":"Anfitrião","descricao":"A Base conta como 1 nível acima para os benefícios de conforto (descanso e Vigor)."},{"nome":"Jardineiro Mestre","categoria":"Talentos de Base e Pasto","nivel":10,"requisito":"Horta Musical","descricao":"Plantas que você cuida sobem 1 nível de qualidade sem precisar de adubo."},{"nome":"Administrador","categoria":"Talentos de Base e Pasto","nivel":12,"requisito":"Pecuarista","descricao":"Seus NPCs com Função de Agronômico, Pecuário ou Tutor produzem 50% a mais."},{"nome":"Fortaleza Viva","categoria":"Talentos de Base e Pasto","nivel":14,"requisito":"Defensor da Base","descricao":"Aliados que lutam ao seu lado dentro da Base também recebem +2 de CA e vantagem na iniciativa."},{"nome":"Lar da Intérprete","categoria":"Talentos de Base e Pasto","nivel":16,"requisito":"Arquiteto","descricao":"Uma vez por andar, a Base recebe automaticamente o benefício do próximo nível de conforto por 1 semana."},{"nome":"Herança Orgulhosa","categoria":"Talentos de Espécie","nivel":2,"requisito":"","descricao":"Uma vez por descanso longo, você usa uma vantagem descritiva da sua espécie como se fosse uma perícia treinada."},{"nome":"Adaptado","categoria":"Talentos de Espécie","nivel":6,"requisito":"Herança Orgulhosa","descricao":"Uma desvantagem numérica da sua espécie é reduzida em 1 ponto."},{"nome":"Sangue Dividido","categoria":"Talentos de Espécie","nivel":10,"requisito":"Adaptado","descricao":"Se você é um híbrido, escolhe 1 vantagem de cada espécie e ignora uma das desvantagens."},{"nome":"Orgulho da Linhagem","categoria":"Talentos de Espécie","nivel":14,"requisito":"Sangue Dividido","descricao":"Suas características de espécie escritas passam a valer também para aliados a 3m de você, 1x por cena."},{"nome":"Cinturão de Itens","categoria":"Talentos de Capacidade","nivel":6,"requisito":"","descricao":"Você pode levar 1 item diverso adicional, acima do limite do seu Nível de Guilda."},{"nome":"Horta Ampliada","categoria":"Talentos de Capacidade","nivel":8,"requisito":"Treinado em Agricultura","descricao":"Sua Base comporta uma segunda horta ou pasto, além da primeira."},{"nome":"Domador Múltiplo","categoria":"Talentos de Capacidade","nivel":10,"requisito":"Voz dos Animais","descricao":"Você pode ter 2 animais adestrados ao mesmo tempo, em vez de 1."},{"nome":"Receita Dupla","categoria":"Talentos de Capacidade","nivel":10,"requisito":"Mente culinária II","descricao":"Você prepara duas refeições iguais com um único teste de culinária e os mesmos ingredientes."},{"nome":"Mula de Carga","categoria":"Talentos de Capacidade","nivel":12,"requisito":"Mochileiro","descricao":"Sua Carga aumenta em 30."},{"nome":"Versátil","categoria":"Talentos de Capacidade","nivel":12,"requisito":"","descricao":"Você escolhe um talento adicional de nível 8 ou menor, cujos requisitos você cumpra."},{"nome":"Cargo Duplo","categoria":"Talentos de Capacidade","nivel":14,"requisito":"Líder de Bando","descricao":"Um NPC seu pode acumular 2 Funções de Aventura ao mesmo tempo, mas só 1 delas concede vantagem em testes."},{"nome":"Mente Expandida","categoria":"Talentos de Capacidade","nivel":16,"requisito":"Cabeça Cheia","descricao":"Você recebe +1 Espaço de Encantamento adicional."},{"nome":"Relicário","categoria":"Talentos de Capacidade","nivel":20,"requisito":"Colecionador de Talismãs","descricao":"Você recebe +1 espaço de talismã e pode equipar dois talismãs da mesma família ao mesmo tempo."},{"nome":"Mão Extra","categoria":"Talentos de Capacidade","nivel":24,"requisito":"","descricao":"Você recebe +1 ação Bônus por turno (exige 40 de Destreza)."},{"nome":"Quinta Alma","categoria":"Talentos de Capacidade","nivel":26,"requisito":"Terceira Habilidade","descricao":"Sua alma recebe uma habilidade passiva adicional, de nível igual ao dela."},{"nome":"Coração Inesgotável","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Vitalidade","descricao":"1x por descanso longo, ao cair a 0 de vida, você volta com 50% da vida máxima em vez de ficar Incapaz. A Poção Espiritual cura 50% a mais de dados de cura."},{"nome":"Mente Infinita","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Mente","descricao":"Seu máximo de Mana aumenta em 50%. 1x por turno, um encantamento de nível 5 ou menor custa metade da mana."},{"nome":"Força Titânica","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Força","descricao":"Seus ataques com armas de Força causam +2 dados de dano, do maior dado da arma, e o dano deles conta em dobro contra a Postura."},{"nome":"Reflexo Absoluto","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Destreza","descricao":"1x por rodada, sem gastar a Reação, quando um ataque o acertaria, você obriga o atacante a rolar de novo e ficar com o pior resultado."},{"nome":"Muralha Viva","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Tenacidade","descricao":"Sua Redução de Dano dobra contra o primeiro golpe que receber em cada rodada, e você não pode ficar Caído nem Agarrado."},{"nome":"Arquimago","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Inteligência","descricao":"1x por combate, você conjura uma Magia de ação comum como ação bônus, e os alvos dela rolam o teste de resistência com desvantagem."},{"nome":"Escolhido da Intérprete","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Fé","descricao":"Seus Feitiços de dano Sagrado ou de Fogo ignoram resistências, e 1x por descanso longo você conjura um Feitiço Ritual como ação completa."},{"nome":"Senhor das Condições","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Arcano","descricao":"Seus encantamentos recebem 1 cópia adicional no escalonamento por Arcano, e as barras de condição que você ativa em um inimigo voltam com +25% em vez de +50%."}],"sets":[{"nome":"Predador","p2":"o primeiro ataque do combate contra um alvo que ainda não agiu recebe +3 de acerto e causa +1 dado de dano.","p4":"seu Ataque Surpresa deixa o alvo Exposto até o início do próximo turno dele. Se esse ataque zera a vida do alvo, você continua escondido."},{"nome":"Gume","p2":"seus acertos críticos causam +6 de dano e aplicam 6 pontos de Sangramento.","p4":"Diminui em 1 o crítico dos seus golpes com armas de longo alcance. O crítico nunca fica abaixo de 18."},{"nome":"Aríete","p2":"golpes corpo a corpo que acertam causam +6 contra a Postura.","p4":"ao quebrar a Postura de um inimigo, você e um aliado a até 9 m têm vantagem no próximo ataque contra ele."},{"nome":"Mira","p2":"+3 de acerto em ataques à distância contra alvos a mais de 9 m.","p4":"ataques à distância passam a reduzir a Postura pela metade do dano causado, algo que normalmente não fazem."},{"nome":"Rancor","p2":"com menos de 50% da vida, você recebe +3 de acerto e +3 de dano.","p4":"1x por descanso longo, ao cair a 0 de vida, você fica com 1 de vida em vez de ficar Incapaz e causa +2 dados de dano até o fim do seu próximo turno."},{"nome":"Anatomista","p2":"+3 em Investigação e Ciências para estudar animais, e o estudo leva metade do tempo. Um estudo bem-sucedido revela 1 Ponto Chave do animal para o grupo.","p4":"ataques contra um Ponto Chave revelado recebem +2 de acerto e, ao acertar, causam +1 dado de dano e +6 contra a Postura."},{"nome":"Vento","p2":"+4,5 m de deslocamento, e terreno difícil não reduz o seu movimento.","p4":"mais +4,5 m (total +9 m). Se você se moveu 9 m ou mais no turno, o primeiro ataque dele causa +1 dado de dano. Golpes de Oportunidade contra você têm desvantagem."},{"nome":"Arsenal","p2":"trocar de arma custa uma ação livre (1x por turno).","p4":"o primeiro ataque com a arma que você acabou de trocar tem vantagem e causa +1 dado de dano."},{"nome":"Alvo Marcado","p2":"seu primeiro acerto em cada combate marca o alvo até o fim do combate (uma marca por vez). Ataques seus contra o marcado causam +1 dado de dano, e ataques contra qualquer outro têm −2 de acerto.","p4":"o marcado tem desvantagem em ataques contra qualquer um que não seja você. Ao zerar a vida do marcado, a marca passa ao inimigo mais próximo e você recebe 6 de vida temporária."},{"nome":"Vingativo","p2":"cada golpe que você sofre acumula 1 ponto de Vingança (máximo 5; zera se você passar um turno sem sofrer golpe nem atacar). Seu próximo ataque causa +3 de dano por ponto e zera os pontos.","p4":"o máximo sobe para 8, e metade do dano do primeiro golpe corpo a corpo que você sofre em cada rodada volta para o agressor."},{"nome":"Estandarte","p2":"aliados a até 9 m recebem +1 de acerto contra um inimigo que você atacou neste turno, até o início do seu próximo turno.","p4":"ao zerar a vida de um inimigo, aliados a até 9 m recebem 6 de vida temporária e +3 de dano no próximo ataque."},{"nome":"Fervor Mortal","p2":"no início de cada turno seu em combate, você recebe 10 pontos de Morte, ignorando resistências e imunidades. Essa Morte soma-se a qualquer outra, inclusive a do Medalhão do Vírus Frenético, e a parte do set zera ao fim do combate. A Morte que vem de efeitos seus (este set e talismãs) nunca passa de 95. Com 60 ou mais de Morte, seus ataques e encantamentos causam +1 dado de dano.","p4":"com 80 ou mais de Morte, você recebe +1 dado de dano adicional, +2 de acerto e fica imune a Abalado, Amedrontado e Aterrorizado. Com 90 ou mais, você ganha uma ação comum extra por rodada, só para Atacar. Em troca, qualquer Morte que não venha de você (inimigos, armadilhas) vale o dobro. Se a Morte passar de 100, você morre normalmente. Toda a morte deste set é limpa pelo uso ativo do MEDALHÃO DO VÍRUS FRENÉTICO, com os efeitos deste Set mantendo por 2 turnos."},{"nome":"Peçonha","p2":"seus acertos aplicam 6 pontos de Veneno (1x por turno).","p4":"os pontos dobram contra alvo Enredado ou Paralisado. A primeira ativação de Veneno em um inimigo o deixa Lento até o fim do próximo turno dele."},{"nome":"Miasma","p2":"seus acertos aplicam 6 pontos de Podridão (1x por turno).","p4":"no fim do turno de cada inimigo adjacente a você, ele sofre 3 pontos de Podridão. Aliados a até 3 m de você ignoram a nuvem."},{"nome":"Sangria","p2":"seus acertos aplicam 6 pontos de Sangramento (1x por turno).","p4":"em acerto crítico, aplica mais 15 pontos de Sangramento, e alvos com Sangramento ativo não podem usar a Reação contra você."},{"nome":"Geada","p2":"seus acertos aplicam 6 pontos de Congelamento (1x por turno).","p4":"inimigo com metade ou menos da vida de Congelamento restante fica Lento até o fim do próximo turno dele."},{"nome":"Delírio","p2":"seus acertos aplicam 6 pontos de Loucura (1x por turno).","p4":"inimigo com metade ou menos da vida de Loucura restante tem desvantagem no próximo ataque dele."},{"nome":"Torpor","p2":"seus acertos aplicam 6 pontos de Sono (1x por turno).","p4":"inimigo com metade ou menos da vida de Sono restante perde a próxima Reação."},{"nome":"Contágio","p2":"quando você ativa uma condição em um inimigo, todos os outros inimigos a até 3 m dele recebem 10 pontos dessa condição.","p4":"o efeito sobe para 20 pontos, e a barra do inimigo que você ativou volta com +25% em vez de +50%."},{"nome":"Casco","p2":"reduz 1d4 + 3 de dano de um tipo físico (cortante, perfurante ou impacto), escolhido a cada descanso.","p4":"a redução vale para os três tipos físicos e sobe em +2."},{"nome":"Bastião","p2":"ao sofrer um golpe, você ganha 6 de vida temporária (1x por rodada).","p4":"o dano de cada acerto crítico que você sofre é reduzido em 6."},{"nome":"Âncora","p2":"se você não se moveu no seu turno, recebe +2 de CA e reduz em 3 o dano de cada golpe que sofrer, até o início do seu próximo turno.","p4":"enquanto estiver parado assim, você é imune a Empurrão, Derrubada e Agarrado, e Golpes de Oportunidade contra você têm desvantagem."},{"nome":"Esquiva","p2":"+3 em Reflexo.","p4":"ao passar em um teste de Reflexo contra efeito de área, você não sofre dano (em vez de metade). Golpes de Oportunidade contra você têm −2 de acerto."},{"nome":"Tenaz","p2":"+3 em Fortitude.","p4":"imune a condições de nível Fraco (como Caído)."},{"nome":"Lúcido","p2":"+3 em Vontade.","p4":"+15 pontos de vida de condição em Loucura e Sono. Quando a Loucura ou o Sono de um aliado a até 9 m é ativado, você ganha vantagem no próximo teste de Vontade."},{"nome":"Sentinela","p2":"quando você sofre um golpe, um aliado adjacente recebe 6 de vida temporária.","p4":"aliados a até 3 m de você reduzem em 3 o dano de cada golpe que sofrem. 1x por rodada, o golpe que deixaria um aliado a até 3 m abaixo de 25% da vida atinge você no lugar."},{"nome":"Sanador","p2":"+3 em Medicina.","p4":"em descanso curto, os aliados recuperam mais 10% da vida máxima. Ao auxiliar um aliado Incapaz, ele rola o d20 de resistir com vantagem."},{"nome":"Sangue Arcano","p2":"seus encantamentos causam +1 dado de dano, mas cada conjuração custa 6 pontos de vida (ignora vida temporária).","p4":"o dado extra sobe para +2 enquanto você estiver com menos de 50% da vida, e o custo em vida cai para 3."},{"nome":"Eco Arcano","p2":"o primeiro encantamento que você conjura em cada combate se repete no seu turno seguinte, sem custo de mana, com metade do dano e do efeito.","p4":"o eco causa o dano e o efeito totais se o encantamento for de Espaço 1."},{"nome":"Fluxo","p2":"+15 de mana máxima.","p4":"1x por turno, um encantamento custa 1 a menos de mana (mínimo 1)."},{"nome":"Alma Prevalente","p2":"+3 em Prevalência.","p4":"vantagem em Prevalência."},{"nome":"Ocultista","p2":"+3 em Religião, e você percebe ao toque se um objeto é encantado.","p4":"vantagem em testes de aprendizado de encantamento (não soma com Biblioteca nem com a Função Erudito)."},{"nome":"Amuleto","p2":"um talismã seu com versões conta como um nível acima (máximo +3).","p4":"dois talismãs seus contam como um nível acima."},{"nome":"Rastreador","p2":"+3 em Percepção e Investigação.","p4":"o grupo nunca é pego de surpresa em emboscadas (não soma com a Função Batedor)."},{"nome":"Navegante","p2":"+3 em Navegação.","p4":"vantagem em Navegação. Rotas que você já percorreu contam como registradas (+6 em Navegação, como um Mapa Regional)."},{"nome":"Colhedor","p2":"+3 em Sorte e Investigação ao coletar recursos.","p4":"sucesso por 5 ou mais acima da DT já rende +1 unidade (em vez de 10)."},{"nome":"Banquete","p2":"+3 em Gastronomia.","p4":"quem come a refeição que você preparou recebe também +15 pontos em uma condição à escolha."},{"nome":"Tecelão","p2":"+3 em Costura.","p4":"falha em Costura custa só 1 item, e você tem vantagem em Costura."},{"nome":"Forjador","p2":"+3 em Tecnologia ao subir arma.","p4":"vantagem em Tecnologia ao subir arma."},{"nome":"Eremita","p2":"descansos curtos recuperam mais 15% da vida máxima.","p4":"quem fica de tocaia recebe um descanso longo completo, e não só um curto."},{"nome":"Sobrevivente","p2":"aguenta 3 dias a mais sem comer antes de ficar com Fome.","p4":"a condição Fome não limita mais as suas ações (o quarto dia continua Incapaz)."},{"nome":"Voz do Povo","p2":"+3 em Persuasão e Intuição em cenas sociais com NPCs.","p4":"vantagem em testes sociais com NPCs (não soma com a Função Diplomata)."},{"nome":"Presença","p2":"+3 em testes de Provocar e de intimidar.","p4":"a DT dos seus Provocar sobe em 3 e alcança um alvo a mais."},{"nome":"Máscara","p2":"+3 em Artes (Disfarce) e em Crime.","p4":"vantagem em Artes (Disfarce) e em Furtividade durante infiltração. NPCs que falham em Percepção não conseguem descrever o seu rosto depois."},{"nome":"Mercador","p2":"+3 em Persuasão ao negociar preços, e você reconhece o valor de um item só de olhar.","p4":"vende itens por 10% a mais (vale o maior entre este set e a Função Tesoureiro)."}],"talismas":[{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +0","efeito":"Cura 1d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +1","efeito":"Cura 2d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +2","efeito":"Cura 3d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +3","efeito":"Cura 4d8 por turno","bonus":{}},{"familia":"Anel das Alavancas","nome":"Anel das Alavancas","efeito":"No início de um conflito social, você recebe 1 alavanca extra, que não conta no limite de uma alavanca por conflito, e o mestre define uma alavanca que o alvo tem contra você. Se o alvo a usar, você sofre -5 em todos os testes sociais até o fim do conflito. Sua primeira falha em cada conflito social não gera Paciência, mas as falhas seguintes geram 1 ponto de Paciência a mais.","bonus":{}},{"familia":"Anel das Muitas Vozes","nome":"Anel das Muitas Vozes","efeito":"Você recebe 3 Espaços de Encantamento adicionais, que só podem ser ocupados por encantamentos de Espaço 1 ou 2. Sempre que conjurar um encantamento equipado em um desses Espaços adicionais, você fica Condenado até o fim do seu próximo turno.","bonus":{}},{"familia":"Anel do Gladiador","nome":"Anel do Gladiador","efeito":"+2d6 de dano físico por 3 turnos após crítico","bonus":{}},{"familia":"Apito do Elo Selvagem","nome":"Apito do Elo Selvagem","efeito":"Você sempre sabe se um animal adestrado seu está co   const C = { escolha, nv, tal, a, tb, d, ef, ativos, nVida, soma, arm, esc, carga, lentidao, exaustao, mov: lentidao ? Math.min(6, d.movimento) : d.movimento, disp, gastos, resto: disp - gastos, treinadas, avisos: [] };
  // avisos

  if (C.resto > 0) av.push(["erro", `Faltam ${C.resto} pontos de atributo para distribuir.`]);
  for (const n of escolha.pendentes) av.push(["erro", `Talento ${n}: escolha ${R.ROTULO_ESCOLHA[R.ESCOLHA_TALENTO[n]].toLowerCase()} (aba Talentos).`]);

  for (const tipo of ["armadura", "escudo"]) { const it = protecao(tipo); if (it) { const m = statusProtecao(C, tipo, it); if (m.length) av.push(["erro", `${it.nome}: ${m.join(", ")}.`]); } }
  for (const sl of SLOTS) {

/* Seletor genérico: itens [{id,nome,sub,motivo[],busca}] — permitidos primeiro */
let pickerAtual = null;
function seletor(cfg) {

  const filtros = (cfg.filtros || []).map((f) => `<select data-filtro="${f.chave}">${f.opcoes.map((o) => `<option ${o === f.valor ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`).join("");

    c.querySelectorAll("[data-filtro]").forEach((s) => s.addEventListener("change", () => { cfg.filtros.find((f) => f.chave === s.dataset.filtro).valor = s.value; listarSeletor(); }));

/* Marca a ação gasta no turno. Completa = Comum + Bônus + Movimento. Devolve um aviso se passou do que havia. */
function marcarAcao(tipo) {
  if (!S || !tipo || !["Comum", "Bônus", "Movimento", "Reação", "Completa"].includes(tipo)) return "";
  const tipos = tipo === "Completa" ? ["Comum", "Bônus", "Movimento"] : [tipo], lim = limitesTurno(), sem = [];
  for (const t of tipos) { S.turno[t] = int(S.turno[t]) + 1; if (S.turno[t] > lim[t]) sem.push(t); }
  salvar();
  return sem.length ? `Não sobrava ação ${sem.join(" e ")} neste turno.` : "";
}
function usosLista() {
  const out = [];
  for (const nome of [...C.tal].sort()) {
    const t = TAL[nome], u = t && R.usosLimitados(t.descricao);
    if (u) out.push({ chave: "tal:" + nome, nome, origem: "Talento", qtd: u[0], periodo: u[1], desc: t.descricao });
  }
  S.talismas.slice(0, C.d.talismas).forEach((t) => {
    const info = TALISMA[t.nome], u = info && R.usosLimitados(info.efeito);
    if (u) out.push({ chave: "tali:" + t.nome, nome: t.nome, origem: "Talismã", qtd: u[0], periodo: u[1], desc: info.efeito });
  });
  return out;
}

A["conjurar"] = (el, ev) => {
  if (ev) ev.stopPropagation();
  const e = ENC[el.dataset.f], v = e && e.versoes.find((x) => x.nivel === int(el.dataset.v)); if (!v) return;
  const k = e.dominio === "Magia" ? "INT" : "FE", per = k === "INT" ? "Feitiçaria" : "Desejo";
  const x = S.encantamentos.find((y) => y.familia === e.nome) || {};
  const impl = Math.max(0, ...S.armas.filter((w) => w.grupo === (k === "INT" ? "Cajado" : "Selo")).map((w) => int(w.nivel, 1)));
  const manaC = custoEnc(e, v)[0], desc = manaC != null && manaC !== R.custoMana(v);
  pagar("mana_atual", C.d.mana, manaC, "Mana", (custo) => {
    const acImpl = impl ? (R.ACERTO_ARMA[impl] || 0) : 0;   // "+ acerto do cajado" (Magias) ou do selo (Feitiços)
    const at = R.rolarAtaque(C.d.bc[k] + C.d.n3 + acImpl, R.vantagem(C.a[k]), 20, rng);
    const linhas = [txtAtaque(at, per), `DT para o alvo resistir: <b>${k === "INT" ? C.d.dt_feiticaria : C.d.dt_desejo}</b>`];
    if (acImpl) linhas.push(`<span class="sub">Inclui +${acImpl} de acerto do ${k === "INT" ? "cajado" : "selo"} nv ${impl}.</span>`);
    const avisoAcao = marcarAcao(v.acao);
    if (avisoAcao) linhas.push(`<span class="erro">${avisoAcao}</span>`);
    let expr = R.danoDoEncantamento(v.descricao);
    const conds = R.condicoesDoEncantamento(v.descricao);
    if (expr && conds.length && expr.replace(/\s+/g, " ") === conds[0][0]) expr = null;
    if (!at.desastre) for (const [ce, cn] of conds) {
      const escl = R.escalarArcano(ce, C.a.ARC, cn), [tot, partes] = R.rolarExpr(escl, rng, at.critico);
      linhas.push(txtDano(tot, partes, cn) + " pontos" + (escl !== ce ? ` <span class="sub">· ${ce} → ${escl} por ${R.cap(C.a.ARC)} de Arcano</span>` : ""));
    }
    if (expr && !at.desastre) {
      const extra = k === "INT" ? C.d.dados_extra_magia : C.d.dados_extra_feitico;
      const [tot, partes] = R.rolarExpr(R.danoComDados(expr, extra), rng, at.critico);
      linhas.push(txtDano(tot, partes, "Dados do encantamento") + (extra ? ` · +${extra} dado por ${k}` : ""));
    } else if (!expr && !conds.length) linhas.push(`<span class="sub">Este encantamento não tem dados na descrição.</span>`);
    if (custo) linhas.push(`<span class="sub">${custo}</span>`);
    if (desc) linhas.push(`<span class="sub">Matrícula: custa ${manaC} de Mana em vez de ${R.custoMana(v)}.</span>`);
    if (!x.equipado) linhas.push(`<span class="erro">Atenção: não está equipado.</span>`);
    if (impl < v.nivel) linhas.push(`<span class="erro">Atenção: precisa de ${k === "INT" ? "cajado" : "selo"} nv ${v.nivel}+ equipado.</span>`);
    mostrarRolagem(`✧ ${e.nome} (${v.tier} nv ${v.nivel})`, linhas);
  });
};

    const ja = S.inventario.find((x) => String(x.item || "").trim().toLowerCase() === nome.toLowerCase());
    if (ja) ja.qtd = String(Math.max(1, int(ja.qtd, 1)) + q); else S.inventario.push({ item: nome, carga: String(it.carga || ""), qtd: String(q) });
    txt = `🎒 Recebeu <b>${q}× ${esc(nome)}</b>${ev.desc ? " — " + esc(ev.desc) : ""}`;
  } else {
    const nome = String(ev.nome || ""), q = Math.max(1, int(ev.qtd, 1));
    const i = S.inventario.findIndex((x) => String(x.item || "").trim().toLowerCase() === nome.toLowerCase());
    if (i < 0) return `O mestre tirou ${esc(nome)}, mas o item não está mais na bolsa.`;
    const resto = Math.max(1, int(S.inventario[i].qtd, 1)) - q;
    if (resto > 0) S.inventario[i].qtd = String(resto); else S.inventario.splice(i, 1);
    txt = `🎒 O mestre tirou <b>${q}× ${esc(nome)}</b>${ev.desc ? " — " + esc(ev.desc) : ""}`;
  }
  salvar(); render(); vibrar(120);
  registrarDiario({ titulo: "📣 Bolsa", linhas: [txt], hora });
  return txt;
}
A["sessao-mao"] = async () => {
  if (!sessao.id) { pedirNomeSessao(); return; }
  try { await api(sessao.mao ? "/api/abaixar" : "/api/mao", { id: sessao.id }); sessao.mao = !sessao.mao; pintarSessao(); consultarSessao(); }
  catch (e) { toast("Sem conexão com o mestre…"); }
};
A["sessao-efeitos"] = () => folha(`Mesa · Rodada ${sessao.rodada}`, sessao.efeitos.length
  ? `<div class="lista">${sessao.efeitos.map((e) => `<div class="item"><span class="marca">⏳</span><div class="tx"><b>${esc(e.nome)}</b><small>${durEfeito(e)}${e.desc ? " · " + esc(e.desc) : ""}</small></div></div>`).join("")}</div>`
  : `<div class="vazio-msg">Nenhum efeito do mestre em você.</div>`, `<button class="botao leve" data-a="sessao-nome">Trocar nome</button><button class="botao prim" data-a="fechar">OK</button>`);
function pintarSessao() {
  const b = $("#mesa");
  if (!b) return;
  b.classList.toggle("oculto", !sessao.ativa);
  document.body.classList.toggle("com-mesa", sessao.ativa);
  if (!sessao.ativa) return;
  const ef = sessao.efeitos.length ? ` · ⏳ ${sessao.efeitos.map((e) => esc(e.nome)).join(", ")}` : "";
  const minha = sessao.vez && sessao.vez === sessao.id;
  b.classList.toggle("vez", !!minha);
  b.innerHTML = `<button class="info" data-a="sessao-efeitos"><b>${sessao.conectado ? (minha ? "⚔ SUA VEZ" : "🛡 Mesa") : "⚠ Sem sinal"}</b> · Rodada ${sessao.rodada}${sessao.vez && !minha ? ` · vez de ${esc(sessao.vez)}` : ""}${ef}${S ? "" : " · abra uma ficha"}</button>
    <button class="mao ${sessao.mao ? "on" : ""}" data-a="sessao-mao">✋ ${sessao.mao ? "Abaixar" : "Mão"}</button>`;
}

// ------------------------------------------------------------------ eventos
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const f = A[el.dataset.a];
  if (!f) return;
  if (el.tagName === "A") ev.preventDefault();
  if (S && banco.modo !== "edicao" && SO_EDICAO.has(el.dataset.a)) {
    toast(`Isso muda a ficha — use o <b>Modo Edição</b>. <button class="botao leve" data-a="modo" style="min-height:32px;padding:4px 10px;margin-left:6px">✎ Editar</button>`);
    return;
  }
  f(el, ev);
});
document.addEventListener("DOMContentLoaded", () => {
  lerLocal();
  if (banco.atual && banco.fichas[banco.atual]) S = normalizar(banco.fichas[banco.atual]);
  $("#veu").addEventListener("click", fecharFolha);
  $("#arquivo").addEventListener("change", (e) => { if (e.target.files[0]) importarArquivo(e.target.files[0]); e.target.value = ""; });
  render();
  setTimeout(ligarNuvem, 50);
  detectarSessao();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !window.claude) navigator.serviceWorker.register("sw.js").catch(() => {});
});
</script>
