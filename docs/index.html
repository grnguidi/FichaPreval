e lutam ao seu lado dentro da Base também recebem +2 de CA e vantagem na iniciativa."},{"nome":"Lar da Intérprete","categoria":"Talentos de Base e Pasto","nivel":16,"requisito":"Arquiteto","descricao":"Uma vez por andar, a Base recebe automaticamente o benefício do próximo nível de conforto por 1 semana."},{"nome":"Herança Orgulhosa","categoria":"Talentos de Espécie","nivel":2,"requisito":"","descricao":"Uma vez por descanso longo, você usa uma vantagem descritiva da sua espécie como se fosse uma perícia treinada."},{"nome":"Adaptado","categoria":"Talentos de Espécie","nivel":6,"requisito":"Herança Orgulhosa","descricao":"Uma desvantagem numérica da sua espécie é reduzida em 1 ponto."},{"nome":"Sangue Dividido","categoria":"Talentos de Espécie","nivel":10,"requisito":"Adaptado","descricao":"Se você é um híbrido, escolhe 1 vantagem de cada espécie e ignora uma das desvantagens."},{"nome":"Orgulho da Linhagem","categoria":"Talentos de Espécie","nivel":14,"requisito":"Sangue Dividido","descricao":"Suas características de espécie escritas passam a valer também para aliados a 3m de você, 1x por cena."},{"nome":"Cinturão de Itens","categoria":"Talentos de Capacidade","nivel":6,"requisito":"","descricao":"Uma vez por turno, você saca ou guarda um item diverso como ação livre."},{"nome":"Horta Ampliada","categoria":"Talentos de Capacidade","nivel":8,"requisito":"Treinado em Agricultura","descricao":"Sua Base comporta uma segunda horta ou pasto, além da primeira."},{"nome":"Domador Múltiplo","categoria":"Talentos de Capacidade","nivel":10,"requisito":"Voz dos Animais","descricao":"Você pode ter 2 animais adestrados ao mesmo tempo, em vez de 1."},{"nome":"Receita Dupla","categoria":"Talentos de Capacidade","nivel":10,"requisito":"Mente culinária II","descricao":"Você prepara duas refeições iguais com um único teste de culinária e os mesmos ingredientes."},{"nome":"Mula de Carga","categoria":"Talentos de Capacidade","nivel":12,"requisito":"Mochileiro","descricao":"Sua Carga aumenta em 30."},{"nome":"Versátil","categoria":"Talentos de Capacidade","nivel":12,"requisito":"","descricao":"Você escolhe um talento adicional de nível 8 ou menor, cujos requisitos você cumpra."},{"nome":"Cargo Duplo","categoria":"Talentos de Capacidade","nivel":14,"requisito":"Líder de Bando","descricao":"Um NPC seu pode acumular 2 Funções de Aventura ao mesmo tempo, mas só 1 delas concede vantagem em testes."},{"nome":"Mente Expandida","categoria":"Talentos de Capacidade","nivel":16,"requisito":"Cabeça Cheia","descricao":"Você recebe +1 Espaço de Encantamento adicional."},{"nome":"Relicário","categoria":"Talentos de Capacidade","nivel":20,"requisito":"Colecionador de Talismãs","descricao":"Você recebe +1 espaço de talismã e pode equipar dois talismãs da mesma família ao mesmo tempo."},{"nome":"Mão Extra","categoria":"Talentos de Capacidade","nivel":24,"requisito":"","descricao":"Você recebe +1 ação Bônus por turno (exige 40 de Destreza)."},{"nome":"Quinta Alma","categoria":"Talentos de Capacidade","nivel":26,"requisito":"Terceira Habilidade","descricao":"Sua alma recebe uma habilidade passiva adicional, de nível igual ao dela."},{"nome":"Coração Inesgotável","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Vitalidade","descricao":"1x por descanso longo, ao cair a 0 de vida, você volta com 50% da vida máxima em vez de ficar Incapaz. A Poção Espiritual cura 50% a mais de dados de cura."},{"nome":"Mente Infinita","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Mente","descricao":"Seu máximo de Mana aumenta em 50%. 1x por turno, um encantamento de nível 5 ou menor custa metade da mana."},{"nome":"Força Titânica","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Força","descricao":"Seus ataques com armas de Força causam +2 dados de dano, do maior dado da arma, e o dano deles conta em dobro contra a Postura."},{"nome":"Reflexo Absoluto","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Destreza","descricao":"1x por rodada, sem gastar a Reação, quando um ataque o acertaria, você obriga o atacante a rolar de novo e ficar com o pior resultado."},{"nome":"Muralha Inabalável","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Tenacidade","descricao":"Sua Redução de Dano dobra contra o primeiro golpe que receber em cada rodada, e você não pode ficar Caído nem Agarrado."},{"nome":"Arquimago","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Inteligência","descricao":"1x por combate, você conjura uma Magia de ação comum como ação bônus, e os alvos dela rolam o teste de resistência com desvantagem."},{"nome":"Escolhido da Intérprete","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Fé","descricao":"Seus Feitiços de dano Sagrado ou de Fogo ignoram resistências, e 1x por descanso longo você conjura um Feitiço Ritual como ação completa."},{"nome":"Senhor das Condições","categoria":"Talentos de Ápice","nivel":22,"requisito":"99 de Arcano","descricao":"Seus encantamentos recebem 1 cópia adicional no escalonamento por Arcano, e as barras de condição que você ativa em um inimigo voltam com +25% em vez de +50%."}],"sets":[{"nome":"Predador","p2":"o primeiro ataque do combate contra um alvo que ainda não agiu recebe +3 de acerto e causa +1 dado de dano.","p4":"seu Ataque Surpresa deixa o alvo Exposto até o início do próximo turno dele. Se esse ataque zera a vida do alvo, você continua escondido."},{"nome":"Gume","p2":"seus acertos críticos causam +6 de dano e aplicam 1d6 de Sangramento.","p4":"Diminui em 1 o crítico dos seus golpes com armas de longo alcance. O crítico nunca fica abaixo de 17."},{"nome":"Aríete","p2":"golpes corpo a corpo que acertam causam +6 contra a Postura.","p4":"ao quebrar a Postura de um inimigo, você e um aliado a até 9 m têm vantagem no próximo ataque contra ele."},{"nome":"Mira","p2":"+3 de acerto em ataques à distância contra alvos a mais de 9 m.","p4":"ataques à distância passam a reduzir a Postura pela metade do dano causado, algo que normalmente não fazem."},{"nome":"Rancor","p2":"com menos de 50% da vida, você recebe +3 de acerto e +3 de dano.","p4":"1x por descanso longo, ao cair a 0 de vida, você fica com 1 de vida em vez de ficar Incapaz e causa +2 dados de dano até o fim do seu próximo turno."},{"nome":"Anatomista","p2":"+3 em Investigação e Ciências para estudar animais, e o estudo leva metade do tempo. Um estudo bem-sucedido revela 1 Ponto Chave do animal para o grupo.","p4":"ataques contra um Ponto Chave revelado recebem +2 de acerto e, ao acertar, causam +1 dado de dano e +6 contra a Postura."},{"nome":"Vento","p2":"+4,5 m de deslocamento, e terreno difícil não reduz o seu movimento.","p4":"mais +4,5 m (total +9 m). Se você se moveu 9 m ou mais no turno, o primeiro ataque dele causa +1 dado de dano. Golpes de Oportunidade contra você têm desvantagem."},{"nome":"Arsenal","p2":"trocar de arma custa uma ação livre (1x por turno).","p4":"o primeiro ataque com a arma que você acabou de trocar tem vantagem e causa +1 dado de dano."},{"nome":"Alvo Marcado","p2":"seu primeiro acerto em cada combate marca o alvo até o fim do combate (uma marca por vez). Ataques seus contra o marcado causam +1 dado de dano, e ataques contra qualquer outro têm −2 de acerto.","p4":"o marcado tem desvantagem em ataques contra qualquer um que não seja você. Ao zerar a vida do marcado, a marca passa ao inimigo mais próximo e você recebe 6 de vida temporária."},{"nome":"Vingativo","p2":"cada golpe que você sofre acumula 1 ponto de Vingança (máximo 5; zera se você passar um turno sem sofrer golpe nem atacar). Seu próximo ataque causa +3 de dano por ponto e zera os pontos.","p4":"o máximo sobe para 8, e metade do dano do primeiro golpe corpo a corpo que você sofre em cada rodada volta para o agressor."},{"nome":"Estandarte","p2":"aliados a até 9 m recebem +1 de acerto contra um inimigo que você atacou neste turno, até o início do seu próximo turno.","p4":"ao zerar a vida de um inimigo, aliados a até 9 m recebem 6 de vida temporária e +3 de dano no próximo ataque."},{"nome":"Fervor Mortal","p2":"no início de cada turno seu em combate, você recebe 10 pontos de Morte, ignorando resistências e imunidades. Essa Morte soma-se a qualquer outra, inclusive a do Medalhão do Vírus Frenético, e a parte do set zera ao fim do combate. A Morte que vem de efeitos seus (este set e talismãs) nunca passa de 95. Com 60 ou mais de Morte, seus ataques e encantamentos causam +1 dado de dano.","p4":"com 80 ou mais de Morte, você recebe +1 dado de dano adicional, +2 de acerto e fica imune a Abalado, Amedrontado e Aterrorizado. Com 90 ou mais, você ganha uma ação comum extra por rodada, só para Atacar. Em troca, qualquer Morte que não venha de você (inimigos, armadilhas) vale o dobro. Se a Morte passar de 100, você morre normalmente. Usar o Medalhão do Vírus Frenético limpa toda a Morte acumulada por este set, e os efeitos do set se mantêm por mais 2 turnos."},{"nome":"Peçonha","p2":"seus acertos aplicam 1d6 de Veneno (1x por turno).","p4":"os pontos dobram contra alvo Enredado ou Paralisado. A primeira ativação de Veneno em um inimigo o deixa Lento até o fim do próximo turno dele."},{"nome":"Miasma","p2":"seus acertos aplicam 1d6 de Podridão (1x por turno).","p4":"no fim do turno de cada inimigo adjacente a você, ele sofre 3 pontos de Podridão. Aliados a até 3 m de você ignoram a nuvem."},{"nome":"Sangria","p2":"seus acertos aplicam 1d6 de Sangramento (1x por turno).","p4":"em acerto crítico, aplica mais 15 pontos de Sangramento, e alvos com Sangramento ativo não podem usar a Reação contra você."},{"nome":"Geada","p2":"seus acertos aplicam 1d6 de Congelamento (1x por turno).","p4":"inimigo com metade ou menos da vida de Congelamento restante fica Lento até o fim do próximo turno dele."},{"nome":"Delírio","p2":"seus acertos aplicam 1d6 de Loucura (1x por turno).","p4":"inimigo com metade ou menos da vida de Loucura restante tem desvantagem no próximo ataque dele."},{"nome":"Torpor","p2":"seus acertos aplicam 1d6 de Sono (1x por turno).","p4":"inimigo com metade ou menos da vida de Sono restante perde a próxima Reação."},{"nome":"Contágio","p2":"quando você ativa uma condição em um inimigo, todos os outros inimigos a até 3 m dele recebem 10 pontos dessa condição.","p4":"o efeito sobe para 20 pontos, e a barra do inimigo que você ativou volta com +25% em vez de +50%."},{"nome":"Casco","p2":"reduz 1d4 + 3 de dano de um tipo físico (cortante, perfurante ou impacto), escolhido a cada descanso.","p4":"a redução vale para os três tipos físicos e sobe em +2."},{"nome":"Bastião","p2":"ao sofrer um golpe, você ganha 6 de vida temporária (1x por rodada).","p4":"o dano de cada acerto crítico que você sofre é reduzido em 6."},{"nome":"Âncora","p2":"se você não se moveu no seu turno, recebe +2 de CA e reduz em 3 o dano de cada golpe que sofrer, até o início do seu próximo turno.","p4":"enquanto estiver parado assim, você é imune a Empurrão, Derrubada e Agarrado, e Golpes de Oportunidade contra você têm desvantagem."},{"nome":"Esquiva","p2":"+3 em Reflexo.","p4":"ao passar em um teste de Reflexo contra efeito de área, você não sofre dano (em vez de metade). Golpes de Oportunidade contra você têm −2 de acerto."},{"nome":"Tenaz","p2":"+3 em Fortitude.","p4":"imune a condições de nível Fraco (como Caído)."},{"nome":"Lúcido","p2":"+3 em Vontade.","p4":"+15 pontos de vida de condição em Loucura e Sono. Quando a Loucura ou o Sono de um aliado a até 9 m é ativado, você ganha vantagem no próximo teste de Vontade."},{"nome":"Sentinela","p2":"quando você sofre um golpe, um aliado adjacente recebe 6 de vida temporária.","p4":"aliados a até 3 m de você reduzem em 3 o dano de cada golpe que sofrem. 1x por rodada, o golpe que deixaria um aliado a até 3 m abaixo de 25% da vida atinge você no lugar."},{"nome":"Sanador","p2":"+3 em Medicina.","p4":"em descanso curto, os aliados recuperam mais 10% da vida máxima. Ao auxiliar um aliado Incapaz, ele rola o d20 de resistir com vantagem."},{"nome":"Alquimista","p2":"+3 em Alquimia.","p4":"vantagem em testes de Alquimia, e uma falha não faz perder ingrediente."},{"nome":"General","p2":"+3 em Tática.","p4":"aliados a até 9 m têm vantagem em Iniciativa."},{"nome":"Agronômico","p2":"+3 em Agricultura.","p4":"sua Horta conta com 1 nível de qualidade acima, até o teto da Base."},{"nome":"Pecuário","p2":"+3 em Adestramento.","p4":"seu Pasto conta com 1 nível de qualidade acima, até o teto da Base."},{"nome":"Tutor","p2":"+3 em Adestramento ao acalmar ou adestrar um animal.","p4":"você pode ter +1 animal adestrado."},{"nome":"Sangue Arcano","p2":"seus encantamentos causam +1 dado de dano, mas cada conjuração custa 6 pontos de vida (ignora vida temporária).","p4":"o dado extra sobe para +2 enquanto você estiver com menos de 50% da vida, e o custo em vida cai para 3."},{"nome":"Eco Arcano","p2":"o primeiro encantamento que você conjura em cada combate se repete no seu turno seguinte, sem custo de mana, com metade do dano e do efeito.","p4":"o eco causa o dano e o efeito totais se o encantamento for de Espaço 1."},{"nome":"Fluxo","p2":"+15 de mana máxima.","p4":"1x por turno, um encantamento custa 1 a menos de mana (mínimo 1)."},{"nome":"Alma Prevalente","p2":"+3 em Prevalência.","p4":"vantagem em Prevalência."},{"nome":"Ocultista","p2":"+3 em Religião, e você percebe ao toque se um objeto é encantado.","p4":"vantagem em testes de aprendizado de encantamento (não soma com Biblioteca nem com a Função Erudito)."},{"nome":"Amuleto","p2":"um talismã seu com versões conta como um nível acima (máximo +3).","p4":"dois talismãs seus contam como um nível acima."},{"nome":"Rastreador","p2":"+3 em Percepção e Investigação.","p4":"o grupo nunca é pego de surpresa em emboscadas (não soma com a Função Batedor)."},{"nome":"Navegante","p2":"+3 em Navegação.","p4":"vantagem em Navegação. Rotas que você já percorreu contam como registradas (+6 em Navegação, como um Mapa Regional)."},{"nome":"Colhedor","p2":"+3 em Sorte e Investigação ao coletar recursos.","p4":"sucesso por 5 ou mais acima da DT já rende +1 unidade (em vez de 10)."},{"nome":"Banquete","p2":"+3 em Gastronomia.","p4":"quem come a refeição que você preparou recebe também +15 pontos em uma condição à escolha."},{"nome":"Tecelão","p2":"+3 em Costura.","p4":"falha em Costura custa só 1 item, e você tem vantagem em Costura."},{"nome":"Forjador","p2":"+3 em Tecnologia ao subir arma.","p4":"vantagem em Tecnologia ao subir arma."},{"nome":"Eremita","p2":"descansos curtos recuperam mais 15% da vida máxima.","p4":"quem fica de tocaia recebe um descanso longo completo, e não só um curto."},{"nome":"Sobrevivente","p2":"aguenta 3 dias a mais sem comer antes de ficar com Fome.","p4":"a condição Fome não limita mais as suas ações (o quarto dia continua Incapaz)."},{"nome":"Voz do Povo","p2":"+3 em Persuasão e Intuição em cenas sociais com NPCs.","p4":"vantagem em testes sociais com NPCs (não soma com a Função Diplomata)."},{"nome":"Presença","p2":"+3 em testes de Provocar.","p4":"seu Provocar alcança um alvo a mais."},{"nome":"Máscara","p2":"+3 em Artes (Disfarce) e em Crime.","p4":"vantagem em Artes (Disfarce) e em Furtividade durante infiltração. NPCs que falham em Percepção não conseguem descrever o seu rosto depois."},{"nome":"Mercador","p2":"+3 em Persuasão ao negociar preços, e você reconhece o valor de um item só de olhar.","p4":"vende itens por 10% a mais (vale o maior entre este set e a Função Tesoureiro)."}],"talismas":[{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +0","efeito":"Cura 1d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +1","efeito":"Cura 2d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +2","efeito":"Cura 3d8 por turno","bonus":{}},{"familia":"Amuleto da Regeneração","nome":"Amuleto da Regeneração +3","efeito":"Cura 4d8 por turno","bonus":{}},{"familia":"Anel das Alavancas","nome":"Anel das Alavancas","efeito":"No início   if (exaustao) av.push(["erro", "Carga: 10 ou menos espaços livres — Exaustão."]);
  const nTal = S.talismas.filter((t) => t.nome).length;
  if (nTal > d.talismas) av.push(["erro", `Talismãs: ${nTal} equipados, limite ${d.talismas}.`]);
  S.armas.forEach((w, i) => { const f = w.grupo && ARMAS[w.grupo] ? statusArma(C, w.grupo, int(w.nivel, 1)) : []; if (f.length) av.push(["erro", `Arma ${i + 1} (${w.grupo}): ${f.join(", ")}.`]); });

  for (const sl of SLOTS) {

}

  if (slot === "extra" || meta) antes = new Set(SLOTS.slice(0, -1).filter((s) => int(s) <= C.nv).map((s) => S.talentos[s]).filter(Boolean));

      <label class="campo"><span>Caminho da Meta de Vida</span><select id="wz-cam">${opt("", !rasc.caminho, "— decidir depois —")}${R.CAMINHOS.map(([n, pp]) => opt(n, rasc.caminho === n, `${n} (${pp})`)).join("")}</select></label>`;

}
function ligarPasso(c) {
  if (passo === 1) c.querySelector("#wz-sem").addEventListener("change", (e) => { $("#wz-alma").style.display = e.target.checked ? "none" : ""; });
  if (passo === 3) c.querySelectorAll("[data-ini]").forEach((sel) => sel.addEventListener("change", () => {
    const usados = [...c.querySelectorAll("[data-ini]")].map((x) => x.value).filter(Boolean);
    c.querySelectorAll("[data-ini]").forEach((x) => [...x.options].forEach((o) => { o.disabled = o.value && o.value !== x.value && usados.includes(o.value); }));
  }));
  if (passo === 3) c.querySelector("[data-ini]").dispatchEvent(new Event("change"));
}
function lerPasso() {
  const val = (id) => { const e = $(id); return e ? e.value : ""; };
  if (passo === 0) Object.assign(rasc, { nome: val("#wz-nome").trim(), player: val("#wz-player").trim(), sonho: val("#wz-sonho"), nivel: int(val("#wz-nivel"), 1) });
  if (passo === 1) Object.assign(rasc, { sem_alma: $("#wz-sem").checked, alma_nome: val("#wz-an").trim(), alma_atr: val("#wz-aa") || "INT", alma_hist: val("#wz-ah"),
    pas_nome: val("#wz-pn").trim(), pas_ef: val("#wz-pe").trim(), atv_nome: val("#wz-tn").trim(), atv_ef: val("#wz-te").trim() });
  if (passo === 2) Object.assign(rasc, { especie: val("#wz-esp").trim(), esp_bon: val("#wz-bon"), esp_pre: val("#wz-pre"), esp_val: int(val("#wz-val")), esp_notas: val("#wz-notas") });
  if (passo === 3) document.querySelectorAll("[data-ini]").forEach((x) => { rasc.ini[x.dataset.ini] = x.value; });
  if (passo === 4) Object.assign(rasc, { pericias: [...document.querySelectorAll(".wz-per:checked")].map((x) => x.value), per_atk: val("#wz-atk"), arma: val("#wz-arma") });
  if (passo === 6) Object.assign(rasc, { vinc_grupo: val("#wz-vg").trim(), vinc_mundo: val("#wz-vm").trim(), caminho: val("#wz-cam") });
}
function erroPasso() {
  if (passo === 0 && !rasc.nome) return "Dê um nome ao personagem.";
  if (passo === 2 && rasc.esp_val && (!rasc.esp_bon || !rasc.esp_pre || rasc.esp_bon === rasc.esp_pre)) return "Escolha atributos diferentes para o bônus e o prejuízo.";
  if (passo === 3) { const vals = R.ATRIBUTOS.map((k) => String(rasc.ini[k] || "")); if (vals.includes("") || new Set(vals).size !== 8) return "Atribua os oito valores, cada um uma vez."; }
  if (passo === 4 && rasc.pericias.length > limPericias()) return `São no máximo ${limPericias()} perícias.`;
  return "";
}
function mostrarPasso() {
  const ult = passo === PASSOS.length - 1;
  folha(`Novo personagem · ${passo + 1}/${PASSOS.length}`, `<div class="passos-wz">${PASSOS.map((_, i) => `<i class="${i < passo ? "feito" : i === passo ? "atual" : ""}"></i>`).join("")}</div>
    <p class="meta" style="margin-top:8px"><b>${PASSOS[passo][0]}</b></p><p class="sub">${PASSOS[passo][1]}</p>${corpoPasso()}<p class="erro" id="wz-erro"></p>`,
  `<button class="botao leve" data-a="${passo ? "wz-voltar" : "fechar"}">${passo ? "‹ Voltar" : "Cancelar"}</button><button class="botao prim" data-a="wz-prox">${ult ? "⚜ Criar ficha" : "Próximo ›"}</button>`, ligarPasso);
}
A["nova"] = () => { rasc = RASC0(); passo = 0; mostrarPasso(); };
A["wz-voltar"] = () => { lerPasso(); passo = Math.max(0, passo - 1); mostrarPasso(); };
A["wz-prox"] = () => {
  lerPasso();
  const e = erroPasso(); if (e) { $("#wz-erro").textContent = e; return; }
  if (passo < PASSOS.length - 1) { passo++; mostrarPasso(); return; }
  const s = novoEstado(), a = rasc;
  Object.assign(s.identidade, { nome: a.nome, player: a.player, sonho: a.sonho, nivel: a.nivel, especie: a.especie });
  s.sem_alma = a.sem_alma; s.especie_notas = a.esp_notas;
  for (const k of R.ATRIBUTOS) { s.atributos[k].inicial = String(a.ini[k]); s.atributos[k].especie = String(a.esp_val ? (R.ATR_POR_NOME[a.esp_bon] === k ? a.esp_val : R.ATR_POR_NOME[a.esp_pre] === k ? -a.esp_val : 0) : 0); }
  if (!a.sem_alma) {
    Object.assign(s.alma, { nome: a.alma_nome, atr: a.alma_atr, historia: a.alma_hist });
    s.alma.habilidades = [[a.pas_nome, a.pas_ef, "Passivo"], [a.atv_nome, a.atv_ef, "Ativo"]].filter(([n, ef]) => n || ef)
      .map(([n, ef, t]) => ({ nome: n, efeito: ef, tipo: t, cats: t === "Ativo" ? ["Dano"] : [], tabela: "", ajustes: [], execucao: t === "Ativo" ? "Comum" : "" }));
  }
  s.pericias = a.pericias; s.pericia_ataque = a.per_atk;
  if (a.arma) s.armas[0] = { grupo: a.arma, nivel: "1", props: "" };
  s.vinculos.grupo = a.vinc_grupo; s.vinculos.mundo = a.vinc_mundo; s.meta.caminho = a.caminho;
  const id = novoIdFicha();
  banco.fichas[id] = s; banco.atual = id; fecharFolha(); abrirFicha(id, "edicao"); salvar();
  toast(a.nivel > 1 ? `Ficha criada no nível ${a.nivel}: distribua os pontos e escolha os talentos.` : "Ficha criada. Ela fica guardada neste aparelho.", 5000);
};

  h += sec("Atributos") + t(["Atributo", "Pontos", "Curva", "BC", "Dados"], R.ATRIBUTOS.map((k) => [R.NOMES_ATR[k], C.a[k], d.curva[k], `+${d.bc[k]}`, `${1 + Math.floor(R.cap(C.a[k]) / 20)}d20`]));
  const per = R.PERICIAS.map(([n, ats, tr]) => { const x = ats || [S.prevalencia_attr || "ARC"]; const [, b, dd] = R.periciaFora(C.a, C.nv, x, C.treinadas.has(n)); return [esc(n) + (tr ? " •" : ""), C.treinadas.has(n) ? "✔" : "", `+${b + (C.ef.pericia[n] || 0)}`, `${dd}d20`]; });

A["nivel"] = (el) => {

A["pts"] = (el) => {

A["vital"] = (el) => mudar((s) => {

A["descanso"] = (el) => {
  const tipo = el.dataset.t;
  if (tipo === "curto" && S.descansos_curtos >= R.DESCANSOS_CURTOS_MAX && !el.dataset.ok) {
    folha("Descanso curto", `<p>Já foram ${S.descansos_curtos} descansos curtos desde o último longo (o livro permite ${R.DESCANSOS_CURTOS_MAX}).</p>`,
      `<button class="botao leve" data-a="fechar">Cancelar</button><button class="botao prim" data-a="descanso" data-t="curto" data-ok="1">Descansar mesmo assim</button>`);
    return;
  }
  const d = C.d, maxs = { vida: d.vida, mana: d.mana, vigor: d.vigor }, ch = { vida: "atual", mana: "mana_atual", vigor: "vigor_atual" };
  const ats = Object.fromEntries(Object.entries(ch).map(([k, c]) => [k, S.vida[c] === "" || S.vida[c] == null ? maxs[k] : int(S.vida[c], maxs[k])]));
  const conds = Object.fromEntries(R.CONDICOES.map((n) => [n, int(S.condicoes[n].atual)]));
  const [novos, nc] = R.descanso(tipo, maxs, ats, conds, d.curto_vida_pct || 0);
  for (const [k, c] of Object.entries(ch)) S.vida[c] = String(novos[k]);
  for (const n of R.CONDICOES) S.condicoes[n].atual = nc[n] ? String(nc[n]) : "";
  S.descansos_curtos = tipo === "longo" ? 0 : S.descansos_curtos + 1;
  if (tipo === "longo") S.desgaste = {};
  recarregarUsos(tipo); S.turno = {}; S.contra_usados = 0;
  fecharFolha(); salvar(); render();
  const mud = R.CONDICOES.filter((n) => conds[n] !== nc[n]).map((n) => `${n} ${conds[n]} → ${nc[n]}`);
  mostrarRolagem(tipo === "curto" ? "☾ Descanso curto" : "☀ Descanso longo", ["vida", "mana", "vigor"].map((k) => `${k[0].toUpperCase() + k.slice(1)}: ${ats[k]} → <b>${novos[k]}</b>`)
    .concat(mud.length ? [`Condições: ${mud.join(", ")}`] : []).concat([`<span class="sub">${tipo === "curto" ? "Pode trocar o equipamento livremente. Usos por descanso curto renovados." : "Efeitos temporários médios somem; armas reafiadas; a Poção Espiritual, a Alma e todos os usos voltam."}</span>`]));
};

A["conjurar"] = (el, ev) => {
  if (ev) ev.stopPropagation();
  const e = ENC[el.dataset.f], v = e && e.versoes.find((x) => x.nivel === int(el.dataset.v)); if (!v) return;
  const k = e.dominio === "Magia" ? "INT" : "FE", per = k === "INT" ? "Feitiçaria" : "Desejo";
  const x = S.encantamentos.find((y) => y.familia === e.nome) || {};
  const impl = Math.max(0, ...S.armas.filter((w) => w.grupo === (k === "INT" ? "Cajado" : "Selo")).map((w) => int(w.nivel, 1)));
  let manaC = custoEnc(e, v)[0];
  const manaMat = manaC, desc = manaC != null && manaC !== R.custoMana(v);
  if (C.eq.mana_pct && manaC != null) manaC = Math.max(1, Math.round(manaC * (100 - C.eq.mana_pct) / 100));   // Pergaminho do Oculto
  pagar("mana_atual", C.d.mana, manaC, "Mana", (custo) => {
    const acImpl = impl ? (R.ACERTO_ARMA[impl] || 0) : 0;   // "+ acerto do cajado" (Magias) ou do selo (Feitiços)
    const at = R.rolarAtaque(C.d.bc[k] + C.d.n3 + acImpl, R.vantagem(C.a[k]), 20, rng);
    const linhas = [txtAtaque(at, per), `DT para o alvo resistir: <b>${k === "INT" ? C.d.dt_feiticaria : C.d.dt_desejo}</b>`];
    if (acImpl) linhas.push(`<span class="sub">Inclui +${acImpl} de acerto do ${k === "INT" ? "cajado" : "selo"} nv ${impl}.</span>`);
    const avisoAcao = marcarAcao(v.acao);
    if (avisoAcao) linhas.push(`<span class="erro">${avisoAcao}</span>`);
    let expr = R.danoDoEncantamento(v.descricao);
    const conds = R.condicoesDoEncantamento(v.descricao);
    if (expr && conds.length && expr.replace(/\s+/g, " ") === conds[0][0]) expr = null;
    const [arc, extraC] = R.arcanoEscala(C.a.ARC, talentos());
    if (!at.desastre) for (const [ce, cn] of conds) {
      const escl = R.escalarArcano(ce, arc, cn, extraC), [tot, partes] = R.rolarExpr(escl, rng, at.critico);
      linhas.push(txtDano(tot, partes, cn) + " pontos" + (escl !== ce ? ` <span class="sub">· ${ce} → ${escl} por ${arc} de Arcano${arc !== R.cap(C.a.ARC) ? " (Mente Arcana +10)" : ""}${extraC && cn !== "Morte" ? " + 1 cópia (Senhor das Condições)" : ""}</span>` : ""));
    }
    if (!at.desastre) linhas.push(...linhasSet(at.critico));
    if (expr && !at.desastre) {
      const extra = k === "INT" ? C.d.dados_extra_magia : C.d.dados_extra_feitico;
      const [tot, partes] = R.rolarExpr(R.danoComDados(expr, extra), rng, at.critico);
      linhas.push(txtDano(tot, partes, "Dados do encantamento") + (extra ? ` · +${extra} dado por ${k}` : ""));
    } else if (!expr && !conds.length) linhas.push(`<span class="sub">Este encantamento não tem dados na descrição.</span>`);
    if (custo) linhas.push(`<span class="sub">${custo}</span>`);
    if (desc) linhas.push(`<span class="sub">Matrícula: custa ${manaMat} de Mana em vez de ${R.custoMana(v)}.</span>`);
    if (C.eq.mana_pct && manaC !== manaMat) linhas.push(`<span class="sub">Pergaminho: −${C.eq.mana_pct}% de custo (${manaMat} → ${manaC} de Mana).</span>`);
    if (!at.desastre) {
      for (const [x, tipo, alvo] of C.eq.dados) {
        if (!(alvo === "mag" || alvo === "tudo")) continue;
        const [t2, p2] = R.rolarExpr(x, rng, at.critico);
        linhas.push(txtDano(t2, p2, `+ ${esc(tipo)}`) + ` <span class="sub">(set ou talismã)</span>`);
      }
      if (C.eq.dano_mag) linhas.push(`+<b>${C.eq.dano_mag}</b> de dano fixo <span class="sub">(sets e talismãs)</span>`);
    }
    if (!x.equipado) linhas.push(`<span class="erro">Atenção: não está equipado.</span>`);
    if (impl < v.nivel) linhas.push(`<span class="erro">Atenção: precisa de ${k === "INT" ? "cajado" : "selo"} nv ${v.nivel}+ equipado.</span>`);
    mostrarRolagem(`✧ ${e.nome} (${v.tier} nv ${v.nivel})`, linhas);
  });
};

const HIST_DADOS = [];

const normDados = (e) => String(e == null ? "" : e).toLowerCase().replace(/\s+/g, "").replace(/(^|[+\-])d(\d+)/g, "$11d$2");
const txtPartes = (partes) => partes.map(([t, v]) => (v.length ? `${t}[${v.length > 14 ? v.slice(0, 14).join(", ") + "…" : v.join(", ")}]` : t)).join(" ");

  const e = normDados(expr);
  if (!/\d+d\d+|^\d+$/.test(e)) return null;
  const [total, partes] = R.rolarExpr(e, rng, !!dobrar);

}

// Portão da Morte: o d20 do começo do turno marca o sucesso ou a falha sozinho (11+ é sucesso)
A["portao-rolar"] = () => {
  const v = rng(20), suc = v >= 11, lim = C.d.limite_morte;
  let msg = "";
  mudar((s) => {
    const arr = s.portao[suc ? "Sucessos" : "Falhas"], i = arr.indexOf(false);
    if (i >= 0 && i < (suc ? 5 : lim)) arr[i] = true;
    const ns = s.portao.Sucessos.filter(Boolean).length, nf = s.portao.Falhas.slice(0, lim).filter(Boolean).length;
    msg = `🎲 Portão da Morte: <b>${v}</b> — ${suc ? "sucesso" : "falha"} (${ns}/5 sucessos, ${nf}/${lim} falhas).`;
    if (ns >= 5) {   // 5 sucessos: volta com 1 de Vida e uma cicatriz
      s.vida.atual = "1"; s.portao = { Sucessos: [false, false, false, false, false], Falhas: [false, false, false, false, false] };
      const n = R.contarCicatrizes(s.cicatrizes); s.cicatrizes = !String(s.cicatrizes || "").trim() || /^\d+$/.test(String(s.cicatrizes).trim()) ? String(n + 1) : s.cicatrizes + ", +1";
      msg += " <b>Você volta com 1 de Vida e ganha uma cicatriz.</b>";
    } else if (nf >= lim) msg += ` <b class="erro">${lim} falhas: o personagem morreu.</b>`;
  });
  mostrarRolagem("☠ Portão da Morte", [msg]);
};

// Adaga (3.3): Estourar remove os acúmulos de Sangria do alvo e causa 2 dados do dado-base da adaga por acúmulo (ignora RD)
function estourar(i) {
  const w = S.armas[i], ar = ARMAS[w.grupo], nv = int(w.nivel, 1), l = ar.tabela.find((x) => x.nivel === nv) || ar.tabela[0];
  const faces = Math.max(...[...String(l.dano).matchAll(/\d+d(\d+)/g)].map((m) => +m[1]), 4), chave = `${i}:${w.grupo}`;
  const n = int((S.recursos[chave] || {})["Acúmulos de Sangria"]);
  if (!n) { toast("Sem acúmulos de Sangria no alvo. Ajuste o contador da Adaga (＋ a cada acerto) antes de Estourar."); return; }
  const [tot, partes] = R.rolarExpr(`${2 * n}d${faces}`, rng);
  mudar((s) => { s.recursos[chave]["Acúmulos de Sangria"] = 0; });
  const aviso = marcarAcao("Bônus");
  mostrarRolagem("💥 Estourar", [txtDano(tot, partes), `<span class="sub">${n} acúmulo(s) × 2 dados de d${faces} (dado-base da adaga nv ${nv}). O dano ignora RD. Execução Silenciosa: com o alvo abaixo de 25% da vida e 5 ou mais acúmulos, é crítico automático (dobre o resultado).</span>`].concat(aviso ? [`<span class="erro">${aviso}</span>`] : []));
}

function importarArquivo(arq) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const bruto = JSON.parse(rd.result);
      if (bruto && bruto.prevalecentes_backup && bruto.fichas) {   // backup de todas as fichas (veja "backup-todas")
        let n = 0;
        for (const f of Object.values(bruto.fichas)) {
          const s = normalizar(f); if (!s.identidade) continue;
          const nome = (s.identidade.nome || "").trim();
          const id = (nome && Object.keys(banco.fichas).find((k) => (banco.fichas[k].identidade.nome || "").trim() === nome)) || "ficha-" + Date.now().toString(36) + "-" + (n++);
          banco.fichas[id] = s;
        }
        gravarLocal(); render(); toast(`Backup restaurado: <b>${Object.keys(bruto.fichas).length}</b> ficha(s).`);
        return;
      }
      const s = normalizar(bruto);
      if (!s.identidade) throw new Error();
      const id = "ficha-" + Date.now().toString(36);
      banco.fichas[id] = s; banco.atual = id; abrirFicha(id); salvar();
      toast(`Ficha <b>${esc(s.identidade.nome || "sem nome")}</b> aberta e guardada neste aparelho.`);
    } catch (e) { toast("Esse arquivo não parece ser uma ficha de Prevalecentes."); }
  };
  rd.readAsText(arq);
}

const hexRgb = (h) => { h = String(h || "").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16); return isNaN(n) || h.length !== 6 ? [0, 0, 0] : [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbHex = (c) => "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const mistura = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return rgbHex(x.map((v, i) => v + (y[i] - v) * t)); };

// empurra a cor do texto para o preto (ou o branco) até ficar legível sobre o fundo
function legivel(cor, fundo, minimo) {
  const alvo = contraste("#000000", fundo) >= contraste("#ffffff", fundo) ? "#000000" : "#ffffff";
  for (let t = 0; t <= 1.0001; t += 0.05) { const c = mistura(cor, alvo, t); if (contraste(c, fundo) >= minimo) return c; }

}

// as 5 cores viram o tema inteiro; avisos lista o que precisou ser ajustado
function derivarPaleta(p) {

  let mold = p.moldura;
  for (let t = 0.05; lumin(mold) > 0.06 && t <= 1; t += 0.05) mold = mistura(p.moldura, "#000000", t);
  if (mold !== p.moldura) avisos.push("a moldura foi escurecida para os textos claros sobre ela continuarem legíveis");
  const V = {};
  V.fundo = mold; V.fundo2 = mistura(mold, "#ffffff", e ? 0.07 : 0.12);
  V.perg = pedra; V.perg2 = mistura(pedra, e ? "#ffffff" : "#000000", e ? 0.07 : 0.07);
  V.campo = mistura(pedra, e ? "#ffffff" : "#ffffff", e ? 0.04 : 0.5);
  const tinta0 = e ? mistura(p.v1, "#ffffff", 0.75) : mistura(mold, "#000000", 0.2);
  V.tinta = legivel(tinta0, V.campo, 7); if (V.tinta !== tinta0) avisos.push("o texto foi ajustado para ficar legível");
  V.tinta2 = legivel(mistura(V.tinta, pedra, 0.38), V.campo, 4.5);
  V.linha = mistura(pedra, V.tinta, e ? 0.16 : 0.18);
  V.vinho = legivel(e ? mistura(p.destaque, "#ffffff", 0.35) : p.destaque, pedra, 4.5);
  if (V.vinho.toLowerCase() !== (e ? mistura(p.destaque, "#ffffff", 0.35) : p.destaque).toLowerCase()) avisos.push("o destaque foi ajustado para aparecer sobre a pedra");

  V.lilas = p.v1; V.lilas2 = mistura(p.v1, "#ffffff", 0.45); V.verdec = p.v2;
  V.chumbo = e ? "#000000" : mistura(mold, "#000000", 0.25);
  V.faixa = mistura(pedra, "#ffffff", 0.6);
  V.rosa = mistura(pedra, "#a3334f", e ? 0.18 : 0.08); V.agua = mistura(pedra, p.v2, e ? 0.12 : 0.18);

  V.sombra = e ? "none" : `0 1px 0 rgba(0,0,0,.04),0 6px 16px -10px ${mold}`;

}

async function api(url, corpo, limite = 15000) {

  const ctl = typeof AbortController === "function" ? new AbortController() : null, prazo = ctl && setTimeout(() => ctl.abort(), limite);

async function detectarSessao() {

    if (!r || !r.sessao) return;
    sessao.pedeSenha = !!r.senha;
    sessao.fichasLista = Array.isArray(r.fichas) ? r.fichas : null;   // o mestre tem a pasta fichas/: o jogador escolhe a ficha
  } catch (e) { return; }
  sessao.ativa = true;
  try {
    const daUrl = (location.hash.match(/(?:^#|&)s=([^&]+)/) || [])[1];   // o link do mestre traz a senha
    if (daUrl) { localStorage.setItem(CH_SENHA, decodeURIComponent(daUrl)); history.replaceState(null, "", location.pathname + location.search); }
    sessao.senha = localStorage.getItem(CH_SENHA) || "";
    sessao.chave = localStorage.getItem(CH_CHAVE) || "";
    sessao.id = localStorage.getItem(CH_SESSAO) || "";
    sessao.ficha = localStorage.getItem(CH_FICHA) || "";
    const [tk, n] = JSON.parse(localStorage.getItem(CH_ACK) || "[]");   // recarregou a página: não repete o que já aplicou
    if (tk) { sessao.token = tk; sessao.ackEv = int(n); }

// Baixa a ficha do notebook. Se o celular tem uma versão mais nova (mudou sem sinal), ela vale e vai para o notebook.
async function carregarFichaMesa(depois = false) {
  if (!sessao.ficha || !sessao.id || baixandoArq) return false;
  baixandoArq = true;
  try {
    let r;
    try { r = await api("/api/ficha-arq?id=" + encodeURIComponent(sessao.id) + "&k=" + sessao.chave); } catch (e) { return false; }
    if (!r.ok) return false;
    const chave = chaveMesa(), local = banco.fichas[chave], desvio = (r.agora || Date.now()) - Date.now();   // relógio do notebook × do celular
    const localAtual = naFichaDaMesa() ? S : local;
    if (r.existe) {
      const localMaisNova = localAtual && (localAtual._salvo || 0) + desvio > r.mtime + 2000 && localAtual._salvo !== sessao.fichaEnviada;
      sessao.fichaVer = r.ver;
      if (localMaisNova) {
        if (!naFichaDaMesa()) { banco.fichas[chave] = localAtual; abrirFicha(chave); }
        sessao.fichaOk = true; enviarFichaMesa(true); return true;
      }
      const s = normalizar(r.ficha); s._salvo = r.mtime - desvio;
      banco.fichas[chave] = s; gravarLocal(); sessao.fichaEnviada = s._salvo;
      if (naFichaDaMesa() || depois) { S = normalizar(s); banco.atual = chave; if (!sessao.fichaOk && !depois) banco.modo = "jogo"; render(); if (depois) toast("O mestre atualizou a sua ficha."); }
      else abrirFicha(chave, "jogo");
      sessao.fichaOk = true;
      return true;
    }
    // o notebook ainda não tem ficha deste jogador
    sessao.fichaOk = true;
    if (local && local.identidade) { sessao.fichaVer = ""; if (!naFichaDaMesa()) abrirFicha(chave); enviarFichaMesa(true); return true; }
    sessao.fichaVer = "";
    sessao.criandoMesa = true;
    semFichaAinda();

  } finally { baixandoArq = false; }
}

async function enviarFichaMesa(forcar = false) {

}

  folha(n ? "Anotação" : "Nova anotação", `<label class="campo"><span>Título</span><input id="nt-t" maxlength="80" value="${esc(n ? n.titulo : "")}" placeholder="O ferreiro de Andar 2"></label>
    <label class="campo"><span>Texto</span><textarea id="nt-x" rows="9" style="width:100%">${esc(n ? n.texto : "")}</textarea></label>`,
    `${n ? `<button class="botao leve" data-a="nota-apagar" data-id="${esc(n.id)}">Apagar</button>` : `<button class="botao leve" data-a="fechar">Cancelar</button>`}<button class="botao prim" data-a="nota-ok" data-id="${esc(n ? n.id : "")}">Salvar</button>`,
    (c) => { const t = $("#nt-x", c); if (t && !n) setTimeout(() => $("#nt-t", c).focus(), 50); });
}
A["nota-nova"] = () => editorNota(null);
A["nota-abrir"] = (el) => { const n = (S.anotacoes || []).find((x) => x.id === el.dataset.id); if (n) editorNota(n); };
A["nota-ok"] = (el) => {
  const titulo = $("#nt-t").value.trim(), texto = $("#nt-x").value;
  if (!titulo && !texto.trim()) { fecharFolha(); return; }
  fecharFolha();
  mudar((s) => {
    const n = s.anotacoes.find((x) => x.id === el.dataset.id);
    if (n) { n.titulo = titulo; n.texto = texto; n.quando = hojeTxt(); }
    else s.anotacoes.unshift({ id: Math.random().toString(36).slice(2, 10), titulo, texto, quando: hojeTxt() });
  });
};
A["nota-apagar"] = (el) => {
  if (!confirm("Apagar esta anotação?")) return;
  fecharFolha(); mudar((s) => { s.anotacoes = s.anotacoes.filter((x) => x.id !== el.dataset.id); });
};
// ------------------------------------------------------------------ Layout de mesa (opcional, liga no menu como o tema)
// Três peças para a hora da luta: a aba Turno (ações, favoritos e o fim do turno numa tela só), a faixa de vitais
// sempre visível no alto e o dado flutuante. A preferência é do aparelho (banco.layout); os favoritos vão na ficha.
const layoutOn = () => !!banco.layout && !!S;
function aplicarLayout() {
  const on = layoutOn();
  document.documentElement.classList.toggle("layout-mesa", on);
  pintarFaixaVitais(); pintarDadoFlutuante();
}
A["layout"] = () => {
  banco.layout = !banco.layout; gravarLocal(); fecharFolha();
  if (banco.layout && S) irPara("combate", "turno");
  render();
  toast(banco.layout ? "Layout de mesa ligado: Combate abre no Turno, vitais sempre à vista e o dado flutuante." : "Layout de mesa desligado.");
};

// --- favoritos: armas, encantamentos e perícias, guardados na ficha
const chaveFav = (f) => `${f.t}:${f.k}`;
function opcoesFav() {
  const ops = [];
  S.armas.forEach((w, i) => { if (ARMAS[w.grupo]) ops.push({ t: "arma", k: String(i), nome: `${w.grupo} nv ${int(w.nivel, 1)}`, sub: "Atacar" }); });
  S.encantamentos.forEach((x) => {
    const e = ENC[x.familia]; if (!e) return;
    e.versoes.filter((v) => x.versoes.includes(v.nivel)).forEach((v) => ops.push({ t: "enc", k: `${e.nome}|${v.nivel}`, nome: `${e.nome}${e.versoes.length > 1 ? " nv " + v.nivel : ""}`, sub: `${v.mana} · ${v.acao}${x.equipado ? "" : " · não equipado"}` }));
  });
  R.PERICIAS.forEach((p) => { const [b, d] = bonusPericia(p[0]); ops.push({ t: "per", k: p[0], nome: p[0], sub: `+${b} · ${d}d20${C.treinadas.has(p[0]) ? " · treinada" : ""}` }); });
  return ops;
}
function favoritosValidos() {
  const ops = new Map(opcoesFav().map((o) => [chaveFav(o), o]));
  return (S.favoritos || []).map((f) => ops.get(chaveFav(f))).filter(Boolean);
}
function usarFav(f) {
  if (f.t === "arma") return A["rolar-arma"]({ dataset: { i: f.k } });
  if (f.t === "enc") { const [fam, nv] = f.k.split("|"); return A["conjurar"]({ dataset: { f: fam, v: nv } }); }
  if (f.t === "per") { const [b, d] = bonusPericia(f.k); contarPericia(f.k); return A["rolar-per"]({ dataset: { n: f.k, b: String(b), d: String(d), rolar: "1" } }); }
}
A["fav-usar"] = (el) => { const f = favoritosValidos().find((x) => chaveFav(x) === el.dataset.c); if (f) { lembrarUltima(f); usarFav(f); } };
A["fav-editar"] = () => {
  const sel = new Set((S.favoritos || []).map(chaveFav)), ops = opcoesFav();
  const grupo = (t, tit) => { const l = ops.filter((o) => o.t === t); return l.length ? `<p class="meta" style="margin:10px 0 4px">${tit}</p><div class="lista">${l.map((o) => `<label class="item"><input type="checkbox" class="fav-ck" value="${esc(chaveFav(o))}" ${sel.has(chaveFav(o)) ? "checked" : ""} style="width:22px;height:22px;margin-right:10px"><div class="tx"><b>${esc(o.nome)}</b><small>${esc(o.sub)}</small></div></label>`).join("")}</div>` : ""; };
  folha("★ Favoritos do turno", `<p class="sub">Marque o que você usa na sua vez. Aparecem em cartões grandes na aba Turno.</p>${grupo("arma", "Armas")}${grupo("enc", "Encantamentos")}${grupo("per", "Perícias")}`,
    `<button class="botao prim" data-a="fav-ok">Salvar</button>`);
};
A["fav-ok"] = () => {
  const marc = [...document.querySelectorAll(".fav-ck")].filter((c) => c.checked).map((c) => { const i = c.value.indexOf(":"); return { t: c.value.slice(0, i), k: c.value.slice(i + 1) }; });
  fecharFolha(); mudar((s) => { s.favoritos = marc.slice(0, 24); });
};

// --- perícias mais usadas e a última rolagem (memória do aparelho, por ficha)
const CH_USO = "prevalecentes.layout.uso";
function usoPericias() { try { return JSON.parse(localStorage.getItem(CH_USO) || "{}")[banco.atual] || {}; } catch (e) { return {}; } }
function contarPericia(nome) {
  try { const t = JSON.parse(localStorage.getItem(CH_USO) || "{}"), m = t[banco.atual] = t[banco.atual] || {}; m[nome] = (m[nome] || 0) + 1; localStorage.setItem(CH_USO, JSON.stringify(t)); } catch (e) { /* sem storage */ }
}
let ultimaFav = null;
function lembrarUltima(f) { ultimaFav = f; }

// --- aba Turno
function pTurno() {
  const [lim] = R.acoesDoTurno(C.d.acoes_extras, S.acoes_extras_tipos);
  const minha = sessao.ativa && sessao.vez && sessao.vez === sessao.id;
  const cab = sessao.ativa ? (minha ? `<div class="turno-aviso sua">⚔ Sua vez · rodada ${sessao.rodada}</div>` : `<div class="turno-aviso">${sessao.vez ? `Vez de <b>${esc(sessao.vez)}</b>` : "Fora de combate"} · rodada ${sessao.rodada}</div>`) : "";
  const fichas = R.TIPOS_ACAO.map((t) => {
    const u = int(S.turno[t]), n = Math.max(lim[t], u);
    return [...Array(n)].map((_, i) => `<button class="ficha-acao t-${t === "Bônus" ? "bonus" : t === "Reação" ? "reacao" : t === "Movimento" ? "mov" : "comum"} ${i < u ? "gasta" : ""}" data-a="turno-marca" data-t="${t}" aria-label="${t} ${i < u ? "gasta" : "livre"}">${t[0]}</button>`).join("");
  }).join("");
  const favs = favoritosValidos();
  let h = cab + secao("Ações do turno") + `<div class="fichas-acao">${fichas}</div>
    <p class="sub ajuda">C comum · B bônus · M movimento · R reação. Toque para gastar ou devolver; ataques e magias gastam sozinhos.</p>`;
  h += secao("Favoritos", `<button class="botao leve mini" data-a="fav-editar">★ Escolher</button>`);
  h += favs.length ? `<div class="favs">${favs.map((f) => `<button class="fav t-${f.t}" data-a="fav-usar" data-c="${esc(chaveFav(f))}"><b>${esc(f.nome)}</b><small>${esc(f.sub)}</small></button>`).join("")}</div>`
    : `<p class="vazio">Toque em ★ Escolher e marque seus ataques, magias e perícias da luta.</p>`;
  const us = typeof usosLista === "function" ? usosLista() : [];
  if (us.length) h += secao("Usos") + `<div class="favs">${us.map((u) => { const usado = int(S.usos[u.chave]); return `<button class="fav t-uso ${usado >= u.qtd ? "esgotado" : ""}" data-a="uso" data-c="${esc(u.chave)}"><b>${esc(u.nome)}</b><small>${u.qtd - usado}/${u.qtd} restantes</small></button>`; }).join("")}</div>`;
  h += secao("Fim do turno") + `<div class="linhabts">${sessao.ativa && sessao.id ? `<button class="botao prim grande" data-a="turno-terminei">✓ Terminei meu turno</button>` : `<button class="botao prim grande" data-a="novo-turno">↻ Novo turno</button>`}</div>
    <div class="linhabts" style="margin-top:8px">${sessao.ativa && sessao.id ? `<button class="botao leve" data-a="novo-turno">↻ Renovar ações</button>` : ""}<button class="botao leve" data-a="novo-combate">⚔ Novo combate</button><button class="botao leve" data-a="acoes-livro">📖 Ações do livro</button></div>`;
  return h;
}
A["turno-terminei"] = async () => {
  try { const r = await ga({ acao: "sinal", sinal: "Terminei meu turno" }); toast(r && r.ok === false ? esc(r.erro || "O mestre desligou os sinais.") : "Avisado: o mestre vê no Grupo que você terminou."); }
  catch (e) { toast("Sem sinal com o mestre."); }
};

// --- faixa de vitais: fica no alto enquanto você rola qualquer aba
function pintarFaixaVitais() {
  const f = $("#faixa-vitais"); if (!f) return;
  if (!layoutOn()) { f.hidden = true; return; }
  const v = S.vida, d = C.d;
  const barra = (rot, cor, ch, mx) => { const at = v[ch] === "" || v[ch] == null ? mx : int(v[ch], mx), p = Math.max(0, Math.min(100, (at / Math.max(1, mx)) * 100));
    return `<button class="fv" data-a="editar-vital" data-chave="${ch}" data-max="${mx}" aria-label="${rot} ${at} de ${mx}"><span>${rot} <b>${at}</b>/${mx}</span><i><em style="width:${p}%;background:${cor}"></em></i></button>`; };
  const conds = R.CONDICOES.filter((n) => int((S.condicoes[n] || {}).atual)).map((n) => `<button class="fv-cond" data-a="editar-cond" data-n="${n}">${n} ${int(S.condicoes[n].atual)}</button>`).join("");
  f.innerHTML = `<div class="fv-linha">${barra("Vida", "var(--c-vida)", "atual", d.vida)}${barra("Mana", "var(--c-mana)", "mana_atual", d.mana)}${barra("Vigor", "var(--c-vigor)", "vigor_atual", d.vigor)}</div>${conds ? `<div class="fv-conds">${conds}</div>` : ""}`;
  f.hidden = false;
}

// --- dado flutuante: toque abre o leque; segurar abre o diário
function pintarDadoFlutuante() {
  const b = $("#dado-flutuante"); if (b) b.hidden = !layoutOn();
}
A["leque"] = () => {
  if (Date.now() - segurouEm < 800) return;    // foi um toque longo: o diário já abriu
  const uso = usoPericias(), top = Object.keys(uso).sort((a, b) => uso[b] - uso[a]).slice(0, 4);
  // as mais roladas nesta ficha; o resto se completa com as treinadas e, por fim, Percepção e Intuição
  const extra = [...C.treinadas].filter((n) => R.PERICIAS.some((p) => p[0] === n)).sort((a, b) => bonusPericia(b)[0] - bonusPericia(a)[0]);
  const pers = [...new Set([...top, ...extra, "Percepção", "Intuição"])].filter((n) => R.PERICIAS.some((p) => p[0] === n)).slice(0, 4);
  folha("🎲 Rolar", `<div class="favs">
      <button class="fav" data-a="rolar-ini"><b>⏳ Iniciativa</b><small>${C.d.iniciativa_dados}d20 +${C.d.iniciativa_bonus}</small></button>
      ${ultimaFav ? `<button class="fav" data-a="leque-repetir"><b>↻ ${esc(ultimaFav.nome)}</b><small>repetir a última</small></button>` : ""}
      ${pers.map((n) => { const [b, d] = bonusPericia(n); return `<button class="fav t-per" data-a="leque-per" data-n="${esc(n)}"><b>${esc(n)}</b><small>+${b} · ${d}d20</small></button>`; }).join("")}
      <button class="fav" data-a="dados"><b>🎲 Dado livre</b><small>2d6+3, d20…</small></button>
      <button class="fav" data-a="diario"><b>📜 Diário</b><small>últimas rolagens</small></button>
    </div><p class="sub">Primeiro as perícias que você mais rola nesta ficha; depois as treinadas.</p>`);
};
A["leque-per"] = (el) => { fecharFolha(); const f = { t: "per", k: el.dataset.n, nome: el.dataset.n }; lembrarUltima(f); usarFav(f); };
A["leque-repetir"] = () => { fecharFolha(); if (ultimaFav) usarFav(ultimaFav); };
let segurouEm = 0;
(function segurarDado() {
  let t = null;
  const ini = () => { clearTimeout(t); t = setTimeout(() => { t = null; segurouEm = Date.now(); if (S) A["diario"](); }, 600); };
  const fim = (ev) => { if (t) { clearTimeout(t); t = null; } else if (ev.cancelable) ev.preventDefault(); };
  const ligar = () => {
    const b = $("#dado-flutuante"); if (!b) return;
    b.addEventListener("touchstart", ini, { passive: true }); b.addEventListener("touchend", fim);
    b.addEventListener("mousedown", ini); b.addEventListener("mouseup", fim); b.addEventListener("mouseleave", () => { clearTimeout(t); t = null; });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ligar); else ligar();
})();
// ------------------------------------------------------------------ eventos
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const f = A[el.dataset.a];
  if (!f) return;
  if (el.tagName === "A") ev.preventDefault();
  if (S && banco.modo !== "edicao" && SO_EDICAO.has(el.dataset.a)) {
    toast(`Isso muda a ficha — use o <b>Modo Edição</b>. <button class="botao leve" data-a="modo" style="min-height:32px;padding:4px 10px;margin-left:6px">✎ Editar</button>`);
    return;
  }
  f(el, ev);
});
document.addEventListener("DOMContentLoaded", async () => {
  lerLocal();
  if (banco.atual && banco.fichas[banco.atual]) S = normalizar(banco.fichas[banco.atual]);
  const recebida = lerHash();
  let chegou = null;
  if (recebida) chegou = await receberFichaDaUrl(recebida);
  $("#veu").addEventListener("click", fecharFolha);
  $("#arquivo").addEventListener("change", (e) => { if (e.target.files[0]) importarArquivo(e.target.files[0]); e.target.value = ""; });
  render();
  setTimeout(ligarNuvem, 50);
  window.__fichaChegou = !!chegou;
  if (recebida && !(chegou && chegou.mesa)) toast(chegou ? `Ficha <b>${esc(chegou.nome)}</b> ${chegou.atualizou ? "atualizada" : "recebida"}.` : "Não consegui ler a ficha enviada. Tente de novo ou use Abrir arquivo .json.", 5000);
  await detectarSessao();
  if (fichaDoApp) confirmarAtualizacao();
  else if (atualizarSlug && mesaAlvo && !recebida) {   // no app instalado: acha a ficha desse jogador e manda para a mesa
    const ids = Object.keys(banco.fichas).filter((k) => [banco.fichas[k].identidade.player, banco.fichas[k].identidade.nome].some((t) => slugNome(t) === atualizarSlug));
    if (ids.length === 1) enviarParaMesa(ids[0]);
    else toast(ids.length ? "Achei mais de uma ficha desse jogador: toque em <b>Enviar</b> na certa." : "Não achei a ficha deste jogador. Toque em <b>Enviar</b> na ficha certa.", 6000);
  }
  if (chegou && sessao.ativa && !sessao.id) entrarSessao((S.identidade.nome || "").trim() || "Jogador", true);
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !window.claude) navigator.serviceWorker.register("sw.js").catch(() => {});
});
</script>
</body>
